<title>Panel Editorial UndraftedZone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
:root {
  --bg: #f5f3ee;
  --bg-2: #efebe3;
  --surface: #ffffff;
  --surface-2: #f3f1ec;
  --line: #e4e0d6;
  --line-2: #d6d1c4;
  --fg: #191b16;
  --muted: #6c7163;
  --accent: #b5461b;
  --accent-2: #e07a3f;
  --accent-soft: #f8e9e1;
  --on-accent: #ffffff;
  --ok: #2d6b3d;
  --ok-soft: #e4f0e6;
  --warn: #8b5b06;
  --warn-soft: #f7eed8;
  --bad: #a1302a;
  --bad-soft: #f7e3e0;
  --info: #22607f;
  --info-soft: #e1eef5;
  --google: #3f7bd6;
  --social: #c2417b;
  --shadow-sm: 0 1px 2px rgba(20, 22, 18, .05);
  --shadow: 0 1px 2px rgba(20, 22, 18, .05), 0 10px 30px -12px rgba(20, 22, 18, .12);
  --r: 16px;
  --r-sm: 10px;
  color-scheme: light;
  --serif: "Source Serif 4", Georgia, serif;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f100d;
    --bg-2: #161813;
    --surface: #181a15;
    --surface-2: #20231c;
    --line: #2a2d25;
    --line-2: #383c32;
    --fg: #eeebe3;
    --muted: #9ea395;
    --accent: #f08a55;
    --accent-2: #f7a878;
    --accent-soft: #382418;
    --on-accent: #1a0e04;
    --ok: #8ccb98;
    --ok-soft: #1c2b1f;
    --warn: #e6bb67;
    --warn-soft: #302810;
    --bad: #f08b80;
    --bad-soft: #36201c;
    --info: #92c8e2;
    --info-soft: #1a2a33;
    --google: #7fb0f0;
    --social: #f08fbb;
    --shadow-sm: none;
    --shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f100d;
  --bg-2: #161813;
  --surface: #181a15;
  --surface-2: #20231c;
  --line: #2a2d25;
  --line-2: #383c32;
  --fg: #eeebe3;
  --muted: #9ea395;
  --accent: #f08a55;
  --accent-2: #f7a878;
  --accent-soft: #382418;
  --on-accent: #1a0e04;
  --ok: #8ccb98;
  --ok-soft: #1c2b1f;
  --warn: #e6bb67;
  --warn-soft: #302810;
  --bad: #f08b80;
  --bad-soft: #36201c;
  --info: #92c8e2;
  --info-soft: #1a2a33;
  --google: #7fb0f0;
  --social: #f08fbb;
  --shadow-sm: none;
  --shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background:
    radial-gradient(1200px 500px at 90% -10%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%),
    var(--bg);
  color: var(--fg);
  font: 15px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px));
  min-height: 100vh;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
a { color: var(--accent); text-underline-offset: 3px; }
img { max-width: 100%; display: block; }
h1, h2, h3 { text-wrap: balance; }

/* Cabecera */
.appbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 16px 2px 14px;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px) saturate(1.2);
  -webkit-backdrop-filter: blur(12px) saturate(1.2);
}
.kicker { margin: 0; font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.appbar h1 { margin: 6px 0 0; font: 600 26px/1.05 var(--serif); letter-spacing: -.01em; }
.live {
  display: inline-flex; align-items: center; gap: 7px; font: 500 12px var(--mono); color: var(--muted);
  padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap;
}
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.live.on::before { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }

/* Navegación */
.nav {
  position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 6px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px) saturate(1.3);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
}
.navbtn {
  position: relative; display: grid; justify-items: center; gap: 4px; padding: 8px 4px 7px; border: 0; background: none; border-radius: 16px;
  font: 500 11px/1 var(--sans); color: var(--muted); transition: color .2s, background .2s;
}
.navbtn svg { width: 22px; height: 22px; }
.navbtn[aria-current="true"] { color: var(--accent); background: var(--accent-soft); }
.navbtn .badge {
  position: absolute; top: 4px; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
  background: var(--accent); color: var(--on-accent); font: 600 11px/18px var(--sans); text-align: center;
  box-shadow: 0 0 0 2px var(--surface);
}
@media (min-width: 900px) {
  body { padding-bottom: 48px; max-width: 1180px; margin: 0 auto; }
  .nav {
    position: sticky; top: 0; left: auto; right: auto; bottom: auto; border: 0; border-radius: 0; box-shadow: none;
    background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none;
    grid-template-columns: repeat(4, max-content); justify-content: start; gap: 6px; padding: 12px 0 14px; z-index: 6;
  }
  .navbtn { grid-auto-flow: column; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-size: 14px; }
  .navbtn svg { width: 18px; height: 18px; }
  .navbtn[aria-current="true"] { background: var(--fg); color: var(--bg); }
  .navbtn .badge { position: static; box-shadow: none; }
  .appbar { display: none; }
}

.screen { display: grid; gap: 16px; padding-top: 4px; min-width: 0; animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } }

/* Piezas comunes */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--line); min-width: 0; }
.sec { display: grid; gap: 12px; min-width: 0; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-head h2 { margin: 0; font: 600 19px/1.2 var(--serif); letter-spacing: -.005em; }
.sec-head span { font: 500 12px var(--mono); color: var(--muted); }
.hint { margin: 0; color: var(--muted); font-size: 14px; }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }

/* Propuesta de hoy */
.hero { position: relative; overflow: hidden; display: grid; min-height: 260px; }
.hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-ph { position: absolute; inset: 0; background: linear-gradient(135deg, var(--accent-soft), var(--surface-2)); }
.hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 20%, rgba(12, 12, 10, .82) 100%);
}
.hero-body { position: relative; z-index: 1; align-self: end; padding: 20px; display: grid; gap: 10px; color: #f6f3ec; }
.hero-body .eyebrow {
  justify-self: start; padding: 6px 10px; border-radius: 999px;
  color: #ffd7bd; background: rgba(12, 12, 10, .6);
}
.hero-body h2 { margin: 0; font: 600 24px/1.2 var(--serif); letter-spacing: -.01em; }
.hero-body p { margin: 0; color: rgba(246, 243, 236, .82); font-size: 14px; }
.hero.empty { min-height: 0; background: var(--surface); }
.hero.empty::after { display: none; }
.hero.empty .hero-body { color: var(--fg); padding: 22px; }
.hero.empty .hero-body p { color: var(--muted); }
.hero .btn { border-color: transparent; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { padding: 14px 14px 12px; display: grid; gap: 8px; min-width: 0; }
.kpi-n { font: 600 26px/1 var(--serif); letter-spacing: -.01em; overflow-wrap: anywhere; }
.kpi-l { font: 500 12px/1.35 var(--sans); color: var(--muted); display: grid; gap: 4px; }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 26px; margin-top: 2px; }
.spark i { flex: 1; min-width: 3px; background: var(--accent); opacity: .35; border-radius: 2px 2px 0 0; }
.spark i:last-child { opacity: 1; }
.delta { font: 600 12px var(--mono); }
.up { color: var(--ok); }
.down { color: var(--bad); }
.flat { color: var(--muted); }

/* Segmentado (filtros de periodo) */
.seg {
  display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 4px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; width: 100%;
}
.seg button {
  padding: 9px 14px; border: 0; border-radius: 999px; background: none; font: 500 14px var(--sans); color: var(--muted);
  transition: background .2s, color .2s;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm), 0 0 0 1px var(--line); font-weight: 600; }

/* Resumen de visitas: día, semana y mes siempre visibles */
.resumen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; }
.res-cell {
  display: grid; gap: 4px; text-align: left; padding: 12px; border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface-2); color: var(--fg); font: inherit; min-width: 0; transition: background .2s, box-shadow .2s;
}
.res-cell[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow-sm), 0 0 0 1px var(--accent); }
.res-l { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.res-n { font: 600 22px var(--serif); font-variant-numeric: tabular-nums; }
.res-d { font: 500 12px var(--sans); }
@media (max-width: 380px) { .res-n { font-size: 18px; } }

/* Dashboard de métricas */
.chart-wrap { overflow-x: auto; }
.achart { width: 100%; height: auto; display: block; min-width: 320px; }
.achart .cg { stroke: var(--line); stroke-width: 1; }
.achart .ct { fill: var(--muted); font: 500 11px var(--sans); font-variant-numeric: tabular-nums; }
.achart .carea { fill: var(--accent); opacity: .12; }
.achart .cline { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.achart .cdot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.achart .cdot.last { fill: var(--accent); }
.insights { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.insights li { position: relative; padding-left: 16px; font-size: 14px; line-height: 1.5; }
.insights li::before { content: ""; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.pg { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.pg:last-child { border-bottom: 0; }
.pg-main { min-width: 0; display: grid; gap: 6px; }
.pg-row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; min-width: 0; }
.pg-ruta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 13px var(--mono); min-width: 0; }
.pg-row b { white-space: nowrap; font-variant-numeric: tabular-nums; }
.ruido { border-style: dashed; }
.salud { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.salud li { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.salud li:last-child { border-bottom: 0; }
.salud .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.salud li.ok .dot { background: var(--good, #3d7a3a); }
.salud li.off .dot { background: var(--warn); }
.salud em { font-style: normal; font-size: 12px; color: var(--muted); text-align: right; }

.sub { font: 600 13px var(--sans); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin: 14px 0 6px; }
.tipo { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font: 600 10px var(--sans); letter-spacing: .05em; text-transform: uppercase; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); vertical-align: middle; }
.achart + .sub { margin-top: 0; }

.checks { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 4px; }
.checks li { display: grid; grid-template-columns: 10px 1fr; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.checks li:last-child { border-bottom: 0; }
.checks .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.checks li.ok .dot { background: var(--good, #3d7a3a); }
.checks li.off .dot { background: var(--bad); }
.checks li.off span:last-child { color: var(--bad); }

/* Listas */
.list { display: grid; gap: 10px; align-content: start; min-width: 0; }
.item {
  display: grid; gap: 10px; text-align: left; width: 100%; min-width: 0; padding: 16px 16px 15px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm);
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
button.item:hover { border-color: var(--line-2); box-shadow: var(--shadow); transform: translateY(-1px); }
.item.is-sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.item-date { font: 500 12px var(--mono); color: var(--muted); white-space: nowrap; }
.item-title { margin: 0; font: 600 17px/1.3 var(--serif); letter-spacing: -.005em; overflow-wrap: anywhere; }
.item-sub { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.item-act { display: flex; gap: 8px; flex-wrap: wrap; }

/* Estados */
.estado { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--sans); padding: 6px 10px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.estado::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.e-warn { background: var(--warn-soft); color: var(--warn); }
.e-ok { background: var(--ok-soft); color: var(--ok); }
.e-bad { background: var(--bad-soft); color: var(--bad); }
.e-info { background: var(--info-soft); color: var(--info); }
.e-quiet { background: var(--surface-2); color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font: 500 12px var(--mono); color: var(--muted); }

/* Botones */
.btn {
  font: 600 14px var(--sans); padding: 12px 18px; border-radius: 12px; border: 1px solid var(--line-2);
  background: var(--surface); min-height: 46px; transition: background .15s, transform .1s, border-color .15s;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 6px 16px -8px var(--accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 92%, #000); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); padding-left: 10px; padding-right: 10px; min-height: 40px; }
.btn.ghost.danger { color: var(--bad); }
.btn.big { width: 100%; }
.btn:disabled { opacity: .5; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spacer { flex: 1; }
.back { justify-self: start; background: none; border: 0; padding: 6px 0; color: var(--muted); font: 500 14px var(--sans); }
.back:hover { color: var(--fg); }

/* Lista y detalle */
.split { display: grid; gap: 16px; min-width: 0; }
.split .detail { display: none; }
.split.has-sel .list { display: none; }
.split.has-sel .detail { display: block; }
@media (min-width: 900px) {
  .split { grid-template-columns: minmax(300px, .85fr) minmax(0, 1.5fr); align-items: start; }
  .split .list, .split .detail { display: grid !important; }
  .split .list { position: sticky; top: 16px; max-height: calc(100vh - 130px); overflow-y: auto; padding: 2px 6px 2px 2px; }
  .split .detail { position: sticky; top: 16px; max-height: calc(100vh - 130px); overflow-y: auto; }
}
.detail-in { padding: 22px; display: grid; gap: 18px; min-width: 0; }
.dtitle { margin: 0; font: 600 26px/1.18 var(--serif); letter-spacing: -.01em; text-wrap: balance; overflow-wrap: anywhere; }
.dmeta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; color: var(--muted); font-size: 13px; }
.block { display: grid; gap: 8px; min-width: 0; }
.block-label { font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.block p, .block ul { margin: 0; overflow-wrap: anywhere; }
.block ul { padding-left: 18px; }
.copy { font: 500 12px var(--sans); padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); }
.copy:hover { border-color: var(--muted); }
code.slug { font: 14px var(--mono); overflow-wrap: anywhere; background: var(--surface-2); padding: 6px 10px; border-radius: 8px; justify-self: start; border: 1px solid var(--line); }
.article {
  border-radius: var(--r-sm); padding: 22px 24px; background: var(--bg); border: 1px solid var(--line); min-width: 0;
}
.articulo { font: 17px/1.75 var(--serif); overflow-wrap: anywhere; color: var(--fg); }
.articulo h3, .articulo h4 { font-family: var(--sans); line-height: 1.3; margin: 1.6em 0 .5em; letter-spacing: -.005em; }
.articulo h3 { font-size: 19px; font-weight: 600; }
.articulo h4 { font-size: 15px; font-weight: 600; color: var(--muted); text-transform: none; }
.articulo p { margin: 0 0 1.05em; }
.articulo ul { padding-left: 22px; margin: 0 0 1.05em; }
.articulo a { color: var(--accent); }
.articulo table { width: 100%; border-collapse: collapse; font: 14px/1.4 var(--sans); margin: 0 0 1.2em; }
.articulo th, .articulo td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.articulo th { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
details.raw summary { cursor: pointer; color: var(--muted); font: 500 13px var(--sans); }
pre.preview { max-height: 260px; overflow: auto; margin: 10px 0 0; padding: 12px; border-radius: 10px; background: var(--surface-2); font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.confirm { display: grid; gap: 10px; padding: 16px; border-radius: var(--r-sm); background: var(--bad-soft); }
.confirm p { margin: 0; }

/* Edición */
.ed { width: 100%; font: 15px/1.5 var(--sans); padding: 11px 13px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--bg); color: var(--fg); }
.ed:focus { border-color: var(--accent); }
.ed.mono { font: 13px/1.5 var(--mono); }
.field { display: grid; gap: 7px; min-width: 0; }

/* Métricas */
.mhead { display: grid; gap: 12px; }
.chart { position: relative; height: 200px; display: grid; grid-template-rows: 1fr auto; gap: 8px; }
.chart-grid { position: absolute; inset: 0 0 26px 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
.chart-grid i { border-top: 1px dashed var(--line); height: 0; }
.bars { position: relative; display: flex; align-items: flex-end; gap: 6px; height: 100%; overflow-x: auto; padding-bottom: 0; }
.bar { flex: 1 0 18px; min-width: 18px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; position: relative; }

<header class="appbar">
  <div>
    <p class="kicker">UndraftedZone</p>
    <h1 id="screen-title">Hoy</h1>
  </div>
  <span class="live" id="sync">Conectando</span>
</header>

<nav class="nav" id="nav" aria-label="Secciones"></nav>
<main class="screen" id="screen"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nowIso = () => new Date().toISOString();
const nf = new Intl.NumberFormat('es-ES');
// Solo portadas embebidas (WebP) o enlaces https; cualquier otra cosa no se pinta.
const imgSegura = u => /^data:image\/webp;base64,[A-Za-z0-9+\/=]+$|^https:\/\/[^\s"'<>]+$/.test(String(u || '')) ? String(u) : '';
const fmt = v => (v === undefined || v === null || v === '') ? '—' : (typeof v === 'number' ? nf.format(v) : esc(v));
const ICON = {
  hoy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  borradores: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>',
  ideas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.6 1 2.5h6c0-.9.2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg>',
  metricas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  vacio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>',
};

const VIEWS = [
  { key: 'hoy', label: 'Hoy', icon: ICON.hoy },
  { key: 'borradores', label: 'Borradores', col: 'borradores', icon: ICON.borradores, open: x => x.estado === 'pendiente_revision' },
  { key: 'ideas', label: 'Ideas', col: 'ideas_evergreen', icon: ICON.ideas, open: x => x.estado === 'propuesta' },
  { key: 'metricas', label: 'Métricas', col: 'metricas', icon: ICON.metricas },
];
const VIEW_TITLE = Object.fromEntries(VIEWS.map(v => [v.key, v.label]));
const COL = { borradores: 'borradores', ideas: 'ideas_evergreen', metricas: 'metricas', seo: 'incidencias_seo', noticias: 'noticias', alertas: 'alertas' };

const ESTADO = {
  pendiente_revision: ['warn', 'Pendiente'], aprobado: ['ok', 'Aprobado'], publicado_borrador: ['ok', 'En WordPress'],
  publicado: ['ok', 'Publicado'], devuelto: ['bad', 'Devuelto'],
  propuesta: ['info', 'Propuesta'], aprobada: ['ok', 'Aprobada'], usada: ['quiet', 'Usada'], denegada: ['quiet', 'Denegada'],
  abierta: ['warn', 'Abierta'], resuelta: ['ok', 'Resuelta'], ignorada: ['quiet', 'Ignorada'],
  nueva: ['info', 'Nueva'], descartada: ['quiet', 'Descartada'],
};

const ACTIONS = {
  approve: { col: 'borradores', patch: { estado: 'aprobado' }, msg: 'Borrador aprobado' },
  return: { col: 'borradores', patch: { estado: 'devuelto' }, msg: 'Devuelto para cambios' },
  approve_idea: { col: 'ideas_evergreen', patch: { estado: 'aprobada' }, msg: 'Idea aprobada: se redactará en el próximo día evergreen' },
  deny_idea: { col: 'ideas_evergreen', patch: { estado: 'denegada' }, msg: 'Idea denegada' },
  resolve_seo: { col: 'incidencias_seo', patch: { estado: 'resuelta' }, msg: 'Incidencia resuelta' },
  ignore_seo: { col: 'incidencias_seo', patch: { estado: 'ignorada' }, msg: 'Incidencia ignorada' },
  resolve_alert: { col: 'alertas', patch: { estado: 'cerrada' }, msg: 'Alerta cerrada' },
};

const state = { ready: false, db: null, view: 'hoy', sel: null, editing: null, confirm: null, periodo: 'semana', data: {}, busy: new Set() };
['borradores', 'ideas', 'metricas', 'seo', 'noticias', 'alertas', 'ediciones'].forEach(k => { state.data[k] = null; });

/* Utilidades */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.hidden = true; }, 2600);
}
function errMsg(e) {
  if (e && (e.code === 'not_granted' || e.code === 'revoked')) return 'No tienes permiso para editar este panel.';
  if (e && e.code === 'invalid_argument') return 'No se pudo guardar: el elemento ya no existe o no es válido.';
  return 'Sin conexión con la base de datos. Inténtalo de nuevo.';
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  return isNaN(d) ? String(s) : d.toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function sortDesc(list) {
  return [...list].sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
}
function safeLink(u) {
  const s = String(u ?? '');
  return /^https:\/\//.test(s) ? '<a href="' + esc(s) + '" target="_blank" rel="noopener noreferrer">' + esc(s) + '</a>' : esc(s || '—');
}
const TAGS_OK = new Set(['P', 'H2', 'H3', 'H4', 'UL', 'OL', 'LI', 'STRONG', 'EM', 'A', 'BLOCKQUOTE', 'BR', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TH', 'TD']);
// Deja solo marcado de artículo seguro: sin scripts, sin atributos salvo enlaces https.
function sanitize(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  (function clean(parent) {
    for (const node of [...parent.childNodes]) {
      if (node.nodeType === 3) continue;
      if (node.nodeType !== 1) { node.remove(); continue; }
      clean(node);
      if (!TAGS_OK.has(node.tagName)) { node.replaceWith(...node.childNodes); continue; }
      for (const attr of [...node.attributes]) node.removeAttribute(attr.name);
      if (node.tagName === 'A') {
        const href = node.getAttribute('href') || '';
        if (/^https:\/\//.test(href)) { node.setAttribute('href', href); node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); }
      }
    }
  })(tpl.content);
  return tpl.innerHTML;
}
function estado(e) {
  const [cls, label] = ESTADO[e] || ['quiet', String(e || '—').replace(/_/g, ' ')];
  return '<span class="estado e-' + cls + '">' + esc(label) + '</span>';
}
function copyBtn(text) {
  return text ? '<button class="copy" data-act="copy" data-copy="' + esc(text) + '">Copiar</button>' : '';
}
function block(label, html, copyText) {
  return '<div class="block"><div class="block-label"><span>' + esc(label) + '</span>' + copyBtn(copyText) + '</div>' + html + '</div>';
}
function copy(text) {
  try {
    navigator.clipboard.writeText(text).then(() => toast('Copiado'), () => toast('No se pudo copiar. Selecciona el texto.'));
  } catch (e) {
    toast('No se pudo copiar. Selecciona el texto.');
  }
}
function btn(act, id, label, primary) {
  const busy = state.busy.has(ACTIONS[act].col + '/' + id);
  return '<button class="btn' + (primary ? ' primary' : '') + '" data-act="' + act + '" data-id="' + esc(id) + '"' + (busy ? ' disabled' : '') + '>' + esc(label) + '</button>';
}
function emptyBox(title, text) {
  return '<div class="empty">' + ICON.vacio + '<strong>' + esc(title) + '</strong><span>' + esc(text) + '</span></div>';
}
function deleteBlock(key, id) {
  const c = state.confirm && state.confirm.key === key && state.confirm.id === id;
  if (c) {
    const extra = key === 'borradores' ? ' La noticia de origen pasa a descartada, para que no se vuelva a redactar.' : '';
    return '<div class="confirm"><p><strong>¿Eliminar este elemento?</strong> No se puede deshacer.' + esc(extra) + '</p>'
      + '<div class="actions"><button class="btn danger" data-act="do_delete" data-key="' + key + '" data-id="' + esc(id) + '">Sí, eliminar</button>'
      + '<button class="btn" data-act="cancel_delete">Cancelar</button></div></div>';
  }
  return '<div class="actions"><span class="spacer"></span><button class="btn ghost danger" data-act="ask_delete" data-key="' + key + '" data-id="' + esc(id) + '">Eliminar</button></div>';
}

/* Métricas: lectura del documento web */
function metricsDoc() {
  return (state.data.metricas || []).find(x => x.id === 'web') || null;
}
function periodoDatos(p) {
  const d = metricsDoc();
  if (!d) return {};
  // Formato por periodos (pasada actual). Si el documento aún trae el formato plano, se muestran sus datos como periodo semana.
  if (d.periodos) return d.periodos[p] || {};
  return p === 'semana' ? { visitas: d.visitas, peticiones: d.peticiones, serie: d.serie, top: d.top, articulos: d.articulos, procedencia: d.procedencia || [] } : {};
}
function deltaHtml(actual, previo) {
  if (typeof actual !== 'number' || typeof previo !== 'number' || previo === 0) return '<span class="delta flat">sin comparar</span>';
  const pct = Math.round((actual - previo) / previo * 100);
  const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
  const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '•';
  return '<span class="delta ' + cls + '">' + arrow + ' ' + Math.abs(pct) + ' %</span>';
}
function cambioHtml(c) {
  if (typeof c !== 'number') return '<span class="delta flat">—</span>';
  const cls = c > 0 ? 'up' : c < 0 ? 'down' : 'flat';
  const arrow = c > 0 ? '▲' : c < 0 ? '▼' : '•';
  return '<span class="delta ' + cls + '">' + arrow + ' ' + Math.abs(c) + ' %</span>';
}
function spark(values) {
  const vals = (values || []).map(v => Number(v) || 0);
  if (!vals.length) return '';
  const max = Math.max(1, ...vals);
  return '<div class="spark" aria-hidden="true">' + vals.map(v => '<i style="height:' + Math.max(8, Math.round(v / max * 100)) + '%"></i>').join('') + '</div>';
}
const PERIODOS = [['dia', 'Día'], ['semana', 'Semana'], ['mes', 'Mes']];
const ORIGEN_CLASE = o => {
  const s = String(o || '').toLowerCase();
  if (s.includes('google')) return 'o-google';
  if (s.includes('instagram') || s.includes('x') || s.includes('facebook') || s.includes('twitter') || s.includes('reddit') || s.includes('whatsapp')) return 'o-social';
  if (s.includes('directo')) return 'o-directo';
  return 'o-otros';
};

/* Vistas */
function heroPropuesta(x) {
  const img = imgSegura(x.imagen_url)
    ? '<img class="hero-img" src="' + esc(imgSegura(x.imagen_url)) + '" alt="">'
    : '<div class="hero-ph"></div>';
  return '<article class="card hero">' + img
    + '<div class="hero-body"><span class="eyebrow">Propuesta de hoy</span>'
    + '<h2>' + esc(x.titulo || 'Sin titular') + '</h2>'
    + '<p>' + esc(x.extracto || '') + '</p>'
    + '<button class="btn primary big" data-act="open" data-screen="borradores" data-id="' + esc(x.id) + '">Revisar propuesta</button></div></article>';
}

/* Estado del ciclo: qué ha pasado hoy y qué falta, de un vistazo */
function horasDesde(s) {
  const t = new Date(s);
  return isNaN(t) ? null : (Date.now() - t.getTime()) / 3600e3;
}
function hace(s) {
  const h = horasDesde(s);
  if (h === null) return '—';
  if (h < 1) return 'hace menos de 1 h';
  if (h < 48) return 'hace ' + Math.round(h) + ' h';
  return 'hace ' + Math.round(h / 24) + ' días';
}
function estadoCicloSec() {
  const d = metricsDoc();
  const h = d ? horasDesde(d.actualizado) : null;
  const pasadaOk = h !== null && h <= 36;
  const ultimo = sortDesc(state.data.borradores || [])[0] || null;
  const v = ultimo && ultimo.verificacion;
  const pendientes = v ? (v.pendientes_humano || []).length : 0;
  const verifOk = !!v && v.sin_comprobar === 0 && pendientes === 0;
  const alertas = (state.data.alertas || []).filter(x => x.estado === 'abierta').length;
  const filas = [
    ['Pasada diaria', d ? hace(d.actualizado) : 'Sin pasadas todavía', pasadaOk],
    ['Borrador más reciente', ultimo ? esc(ultimo.titulo || 'Sin titular') : 'Ninguno', !!ultimo],
    ['Verificación', v ? fmt(v.confirmadas + (v.corregidas || 0)) + ' confirmadas · ' + fmt(v.sin_comprobar) + ' sin comprobar' + (pendientes ? ' · ' + pendientes + ' para ti' : '') : 'Sin verificar', verifOk],
    ['Alertas abiertas', alertas ? fmt(alertas) + ' pendientes' : 'Ninguna', alertas === 0],
  ];
  return '<section class="card panel"><div class="sec-head"><h2>Estado del ciclo</h2><span>hoy</span></div><ul class="salud">'
    + filas.map(([nombre, valor, ok]) => '<li class="' + (ok ? 'ok' : 'off') + '"><span class="dot"></span><span>' + esc(nombre) + '</span><em>' + valor + '</em></li>').join('')
    + '</ul></section>';
}

function renderHoy() {
  const borr = sortDesc(state.data.borradores || []);
  const pend = borr.filter(x => x.estado === 'pendiente_revision');
  const ideas = state.data.ideas || [];
  const idea = ideas.find(x => x.estado === 'propuesta');
  const enCola = ideas.filter(x => x.estado === 'aprobada').length;
  const seo = (state.data.seo || []).filter(x => x.estado === 'abierta');
  const sem = periodoDatos('semana');
  const hero = pend.length ? heroPropuesta(pend[0])
    : '<article class="card hero empty"><div class="hero-body"><span class="eyebrow">Hoy</span><p>No hay propuesta pendiente. La siguiente aparecerá aquí cuando se genere.</p></div></article>';
  const serieSem = (sem.serie || []).map(s => s.visitas);
  const kpis = '<div class="kpis">'
    + '<div class="card kpi"><span class="kpi-n">' + fmt(pend.length) + '</span><span class="kpi-l">Propuestas por revisar</span></div>'
    + '<div class="card kpi"><span class="kpi-n">' + fmt(sem.visitas) + '</span><span class="kpi-l">Visitas 7 días ' + deltaHtml(sem.visitas, sem.visitas_previas) + spark(serieSem) + '</span></div>'
    + '<div class="card kpi"><span class="kpi-n">' + fmt(enCola) + '</span><span class="kpi-l">Ideas aprobadas en cola</span></div>'
    + '</div>';
  const ideaSec = idea
    ? '<section class="sec"><div class="sec-head"><h2>Idea evergreen</h2><span>una a la vez</span></div>'
      + '<article class="card item"><div class="item-top">' + estado('propuesta') + '</div>'
      + '<h3 class="item-title">' + esc(idea.titulo || 'Idea') + '</h3>'
      + '<p class="item-sub">' + esc(idea.angulo || '') + '</p>'
      + '<div class="item-act">' + btn('approve_idea', idea.id, 'Aprobar', true) + btn('deny_idea', idea.id, 'Denegar', false) + '</div></article></section>'
    : '';
  const seoSec = seo.length
    ? '<section class="sec"><div class="sec-head"><h2>Incidencias SEO</h2><span>' + seo.length + ' abiertas</span></div>'
      + seo.slice(0, 5).map(x => '<article class="card item"><div class="item-top">' + estado(x.estado) + '<span class="item-date">' + esc(x.prioridad || '') + '</span></div>'
        + '<h3 class="item-title">' + esc(x.problema || 'Incidencia') + '</h3>'
        + '<p class="item-sub">' + esc(x.sugerencia || x.pagina || '') + '</p>'
        + '<div class="item-act">' + btn('resolve_seo', x.id, 'Resuelta', true) + btn('ignore_seo', x.id, 'Ignorar', false) + '</div></article>').join('')
      + '</section>'
    : '';
  const alertasAbiertas = sortDesc((state.data.alertas || []).filter(x => x.estado === 'abierta')).slice(0, 6);
  const alertaSec = alertasAbiertas.length
    ? '<section class="sec"><div class="sec-head"><h2>Alertas abiertas</h2><span>' + alertasAbiertas.length + '</span></div>'
      + alertasAbiertas.map(x => '<article class="card item"><div class="item-top">' + estado(x.estado) + '<span class="item-date">' + esc(x.tipo || '') + ' · ' + esc(fmtDate(x.fecha)) + '</span></div>'
        + '<h3 class="item-title">' + esc(x.mensaje || 'Alerta') + '</h3>'
        + (x.contexto ? '<p class="item-sub">' + esc(String(x.contexto).slice(0, 280)) + '</p>' : '')
        + '<div class="item-act">' + btn('resolve_alert', x.id, 'Cerrar alerta', true) + '</div></article>').join('')
      + '</section>'
    : '';
  return estadoCicloSec() + hero + kpis + alertaSec + ideaSec + seoSec;
}

function cardBorrador(x) {
  const sel = x.id === state.sel ? ' is-sel' : '';
  const tags = (x.etiquetas || []).slice(0, 4).map(t => '<span>' + esc(t) + '</span>').join('');
  return '<button class="item' + sel + '" data-act="select" data-id="' + esc(x.id) + '">'
    + '<div class="item-top">' + estado(x.estado) + '<span class="item-date">' + esc(fmtDate(x.fecha)) + '</span></div>'
    + '<h3 class="item-title">' + esc(x.titulo || 'Sin titular') + '</h3>'
    + '<p class="item-sub">' + esc(x.extracto || '') + '</p>'
    + (tags ? '<div class="chips">' + tags + '</div>' : '') + '</button>';
}

function editor(x) {
  const v = s => esc(s || '');
  return '<div class="detail-in">'
    + '<button class="back" data-act="cancel_edit">← Cancelar edición</button>'
    + '<h2 class="dtitle">Editando borrador</h2>'
    + '<div class="field"><div class="block-label"><span>Titular</span></div><input class="ed" id="ed-titulo" value="' + v(x.titulo) + '"></div>'

}

function checklist(x) {
  const html = String(x.cuerpo_html || '');
  const texto = html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  const pal = texto ? texto.split(' ').length : 0;
  const hrefs = [...html.matchAll(/href="([^"]+)"/g)].map(m => m[1]);
  const int = hrefs.filter(u => /^https:\/\/undraftedzone\.com\//.test(u)).length;
  const ext = hrefs.length - int;
  const ex = String(x.extracto || '').length;
  const ti = String(x.titulo || '').length;
  const todo = [x.titulo, x.extracto, texto, x.pie_instagram].join(' ').toLowerCase();
  const items = [
    [!!imgSegura(x.imagen_url), 'Portada WebP', 'Falta la portada'],
    [pal >= 600, pal + ' palabras en el cuerpo', 'Cuerpo de menos de 600 palabras'],
    [int >= 3 && int <= 5, int + ' enlaces internos', int + ' enlaces internos (se piden 3–5)'],
    [ext === 0, 'Sin enlaces externos', ext + ' enlaces externos en el cuerpo'],
    [ex >= 140 && ex <= 160, 'Extracto de ' + ex + ' caracteres', 'Extracto de ' + ex + ' caracteres (140–160)'],
    [ti >= 50 && ti <= 65, 'Titular de ' + ti + ' caracteres', 'Titular de ' + ti + ' caracteres (50–65)'],
    [!/apuest|cuota|odds|bookmaker|casino|parlay/.test(todo), 'Sin términos de apuestas', 'Término de apuestas detectado'],
  ];
  return '<ul class="checks">' + items.map(([ok, a, b]) => '<li class="' + (ok ? 'ok' : 'off') + '"><span class="dot"></span><span>' + esc(ok ? a : b) + '</span></li>').join('') + '</ul>';
}

const ETIQUETA_CAMPO = { titulo: 'titular', slug: 'slug', extracto: 'extracto', etiquetas: 'etiquetas', pie_instagram: 'pie', cuerpo_html: 'cuerpo' };
function camposCambiados(e) {

function historialBlock(x) {

/* Métricas: dashboard. Separa lectores reales de escáneres. */
const SCAN_RE = /\.env|\.s3cfg|\.git|\.aws|\.sql|\.bak|\.ya?ml|\.php\d?\b|admin\.php|wp-login|xmlrpc|phpmyadmin|cgi-bin|\/config|\/vendor\//i;
const esEscaner = ruta => SCAN_RE.test(String(ruta || ''));
function techo(m) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, m))));
  const n = m / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}
function graficoArea(serie) {
  const pts = (serie || []).map(s => ({ l: String(s.dia || ''), v: Number(s.visitas) || 0 }));
  if (!pts.length) return '';
  const W = 640, H = 240, L = 44, R = 12, T = 16, B = 30;
  const top = techo(Math.max(...pts.map(p => p.v)));
  const x = i => pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (H - T - B) * (1 - v / top);
  const grid = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const yy = y(top * f).toFixed(1);
    return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" class="cg"/>'
      + '<text x="' + (L - 8) + '" y="' + (+yy + 4) + '" class="ct" text-anchor="end">' + fmt(Math.round(top * f)) + '</text>';
  }).join('');
  const linea = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = linea + ' L' + x(pts.length - 1).toFixed(1) + ' ' + (H - B) + ' L' + x(0).toFixed(1) + ' ' + (H - B) + ' Z';
  const paso = Math.ceil(pts.length / 6);
  const etiquetas = pts.map((p, i) => (i % paso === 0 || i === pts.length - 1)
    ? '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" class="ct" text-anchor="middle">' + esc(p.l.slice(-5)) + '</text>' : '').join('');
  const puntos = pts.map((p, i) => '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="' + (i === pts.length - 1 ? 5 : 3)
    + '" class="cdot' + (i === pts.length - 1 ? ' last' : '') + '"><title>' + esc(p.l) + ': ' + fmt(p.v) + ' visitas</title></circle>').join('');
  return '<svg class="achart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Visitas del periodo">'
    + grid + '<path d="' + area + '" class="carea"/><path d="' + linea + '" class="cline"/>' + puntos + etiquetas + '</svg>';
}
function lecturas(p) {
  const out = [];
  const serie = p.serie || [];
  if (typeof p.visitas === 'number' && typeof p.visitas_previas === 'number' && p.visitas_previas) {
    const pct = Math.round((p.visitas - p.visitas_previas) / p.visitas_previas * 100);
    out.push((pct >= 0 ? 'Sube ' : 'Baja ') + Math.abs(pct) + ' % frente al periodo anterior: ' + fmt(p.visitas) + ' visitas frente a ' + fmt(p.visitas_previas) + '.');
  }
  if (serie.length) {
    const mx = serie.reduce((a, b) => (b.visitas || 0) > (a.visitas || 0) ? b : a);
    out.push('Pico en ' + mx.dia + ' con ' + fmt(mx.visitas) + ' visitas.');
  }
  const top = p.top || [];
  const tot = top.reduce((a, r) => a + (r.visitas || 0), 0);
  const esc2 = top.filter(r => esEscaner(r.ruta)).reduce((a, r) => a + (r.visitas || 0), 0);
  if (tot && esc2) out.push(Math.round(esc2 / tot * 100) + ' % de las visitas del top son escáneres buscando archivos sensibles (.env, .s3cfg, admin.php). No son lectores.');
  if (!out.length) out.push('Todavía no hay datos suficientes en este periodo.');
  return out;
}
function paginasReales(top) {
  const reales = (top || []).filter(r => !esEscaner(r.ruta));
  const max = Math.max(1, ...reales.map(r => r.visitas || 0));
  return reales.slice(0, 10).map((r, i) => '<li class="pg"><span class="n">' + (i + 1) + '</span><div class="pg-main">'
    + '<div class="pg-row"><span class="pg-ruta">' + esc(r.ruta) + (r.tipo ? ' <span class="tipo">' + esc(r.tipo) + '</span>' : '') + '</span><b>' + fmt(r.visitas) + ' ' + cambioHtml(r.cambio) + '</b></div>'
    + '<div class="track"><i style="width:' + Math.round((r.visitas || 0) / max * 100) + '%"></i></div></div></li>').join('');
}
function escaneres(top) {
  const e = (top || []).filter(r => esEscaner(r.ruta));
  if (!e.length) return '';
  const suma = e.reduce((a, r) => a + (r.visitas || 0), 0);
  return '<section class="card panel ruido"><div class="sec-head"><h2>Ruido de escáneres</h2><span>' + fmt(suma) + ' peticiones</span></div>'
    + '<p class="hint">Bots que buscan credenciales y archivos de configuración. No son lectores y no cuentan como audiencia.</p>'
    + '<div class="chips">' + e.slice(0, 6).map(r => '<span>' + esc(r.ruta) + ' · ' + fmt(r.visitas) + '</span>').join('') + '</div></section>';
}
function saludDatos(d, p) {
  const comprobar = (nombre, ok, pendiente) => '<li class="' + (ok ? 'ok' : 'off') + '"><span class="dot"></span><span>' + esc(nombre) + '</span><em>' + (ok ? 'Con datos' : esc(pendiente)) + '</em></li>';
  return '<section class="card panel"><div class="sec-head"><h2>Estado de los datos</h2><span>qué llega y qué falta</span></div><ul class="salud">'
    + comprobar('Visitas del periodo', typeof p.visitas === 'number', 'Sin datos de Cloudflare')
    + comprobar('Serie temporal', (p.serie || []).length > 0, 'Sin serie')
    + comprobar('Páginas', (p.top || []).length > 0, 'Sin top de páginas')
    + comprobar('Países y dispositivos', (p.paises || []).length > 0 || (p.dispositivos || []).length > 0, 'Pendiente en la pasada')
    + comprobar('Core Web Vitals', (d.cwv || []).length > 0, 'Falta Web Analytics en el sitio')
    + comprobar('Procedencia', (p.procedencia || []).length > 0, 'Pendiente en la pasada')
    + comprobar('Artículos con impacto', (p.articulos || []).length > 0, 'Pendiente: WordPress sin vistas')
    + '</ul></section>';
}
function barrasLista(items, etiqueta, valor) {
  const total = items.reduce((a, o) => a + (valor(o) || 0), 0);
  return '<div class="procs">' + items.map(o => {
    const v = valor(o) || 0;
    const pct = total ? Math.round(v / total * 100) : 0;
    return '<div class="proc o-otros"><div class="proc-row"><span>' + esc(etiqueta(o)) + '<span class="pct">' + pct + ' %</span></span><b>' + fmt(v) + '</b></div><div class="track"><i style="width:' + pct + '%"></i></div></div>';
  }).join('') + '</div>';
}
const DISPOSITIVO = { desktop: 'Escritorio', mobile: 'Móvil', tablet: 'Tableta' };
function seccionTendencia(d) {
  const s = d.tendencia_semanal || [];
  return '<section class="card panel"><div class="sec-head"><h2>Tendencia semanal</h2><span>semanas completas</span></div>'
    + (s.length ? '<div class="chart-wrap">' + graficoArea(s.map(x => ({ dia: x.semana, visitas: x.visitas }))) + '</div>'
      : '<p class="hint">Sin semanas completas todavía. Se llena con el histórico diario.</p>') + '</section>';
}
function seccionAudiencia(p) {
  const dis = p.dispositivos || [];
  const tot = dis.reduce((a, o) => a + (o.visitas || 0), 0);
  const movil = dis.filter(o => o.tipo === 'mobile').reduce((a, o) => a + (o.visitas || 0), 0);
  const pctMovil = tot ? Math.round(movil / tot * 100) : null;
  const pa = p.paises || [], nav = p.navegadores || [], so = p.sistemas || [];
  return '<section class="card panel"><div class="sec-head"><h2>Audiencia</h2><span>' + (pctMovil === null ? 'sin datos' : pctMovil + ' % móvil') + '</span></div>'
    + (pa.length ? '<h3 class="sub">Países</h3>' + barrasLista(pa, o => o.pais, o => o.visitas) : '<p class="hint">Sin datos de países todavía.</p>')
    + (dis.length ? '<h3 class="sub">Dispositivos</h3>' + barrasLista(dis, o => DISPOSITIVO[o.tipo] || o.tipo, o => o.visitas) : '<p class="hint">Sin datos de dispositivos todavía.</p>')
    + (nav.length ? '<h3 class="sub">Navegadores</h3>' + barrasLista(nav, o => o.nombre, o => o.visitas) : '')
    + (so.length ? '<h3 class="sub">Sistemas operativos</h3>' + barrasLista(so, o => o.nombre, o => o.visitas) : '')
    + '</section>';
}
function seccionCWV(d) {
  const c = d.cwv || [];
  const clase = (v, b) => v == null ? '' : (v <= b[0] ? 'ok' : v <= b[1] ? 'warn' : 'bad');
  if (!c.length) return '<section class="card panel"><div class="sec-head"><h2>Core Web Vitals</h2><span>usuarios reales</span></div><div class="pending"><strong>Pendiente de activar la medición</strong><span>Hace falta el script de Cloudflare Web Analytics en el sitio. Con él, el panel muestra LCP, INP y CLS por página con datos de usuarios reales.</span></div></section>';

    + c.slice(0, 15).map(r => '<tr><td>' + esc(r.ruta) + '</td><td class="' + clase(r.lcp_ms, [2500, 4000]) + '">' + fmt(r.lcp_ms) + ' ms</td><td class="' + clase(r.inp_ms, [200, 500]) + '">' + fmt(r.inp_ms) + ' ms</td><td class="' + clase(r.cls, [0.1, 0.25]) + '">' + (r.cls == null ? '—' : esc(r.cls)) + '</td></tr>').join('')

    + '</div>';

  return resumen

    + '<div class="card kpi"><span class="kpi-n">' + (typeof p.visitas === 'number' ? fmt(p.visitas) : '—') + '</span><span class="kpi-l">Visitas ' + etiqueta.toLowerCase() + '</span></div>'

    + '</div>'
    + '<section class="card panel"><div class="sec-head"><h2>Visitas</h2><span>' + etiqueta + '</span></div>'
    + (p.nota ? '<p class="hint">' + esc(p.nota) + '</p>' : '')
    + (serie.length ? '<div class="chart-wrap">' + graficoArea(serie) + '</div>' : '<p class="hint">Sin serie para este periodo todavía.</p>') + '</section>'
    + '<section class="card panel"><div class="sec-head"><h2>Lectura rápida</h2><span>calculada del periodo</span></div><ul class="insights">'
    + lecturas(p).map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></section>'
    + '<section class="card panel"><div class="sec-head"><h2>Páginas reales</h2><span>sin escáneres</span></div><ol class="rank pglist">' + (paginasReales(p.top) || '<li><span>Sin datos todavía</span></li>') + '</ol></section>'
    + escaneres(p.top)
    + '<section class="card panel"><div class="sec-head"><h2>De dónde llegan</h2><span>' + fmt(totalProc) + ' visitas</span></div>' + procHtml + '</section>'
    + '<section class="card panel"><div class="sec-head"><h2>Artículos con más impacto</h2><span>vistas</span></div><ol class="rank">' + (arts || '<li><span>Sin datos todavía</span></li>') + '</ol></section>'
    + seccionTendencia(d)
    + seccionAudiencia(p)
    + seccionCWV(d)
    + saludDatos(d, p)
    + '<p class="foot">Actualizado ' + esc(fmtDate(d.actualizado)) + '</p>';
}

function uploadBtn(x) {
  const label = x.subida_solicitada ? 'Publicación solicitada' : 'Publicar en WordPress';
  return '<button class="btn primary" data-act="upload" data-id="' + esc(x.id) + '">' + label + '</button>';
}

/* Render principal */
function renderNav() {
  const borr = (state.data.borradores || []).filter(x => x.estado === 'pendiente_revision').length;
  const ideas = (state.data.ideas || []).filter(x => x.estado === 'propuesta').length;
  document.getElementById('nav').innerHTML = VIEWS.map(v => {
    const n = v.key === 'borradores' ? borr : v.key === 'ideas' ? ideas : 0;
    const badge = n ? '<span class="badge">' + n + '</span>' : '';
    return '<button class="navbtn" data-act="nav" data-view="' + v.key + '" aria-current="' + (state.view === v.key) + '">'
      + v.icon + '<span>' + esc(v.label) + '</span>' + badge + '</button>';
  }).join('');
}

function render() {
  renderNav();
  document.getElementById('screen-title').textContent = VIEW_TITLE[state.view] || 'Hoy';
  const s = document.getElementById('screen');
  if (!state.ready) { s.innerHTML = emptyBox('Conectando', 'Un momento…'); return; }
  if (!state.db) { s.innerHTML = emptyBox('Sin acceso a los datos', 'Pide acceso al propietario de este artifact.'); return; }
  const fn = { hoy: renderHoy, borradores: renderBorradores, ideas: renderIdeas, metricas: renderMetricas }[state.view] || renderHoy;
  s.innerHTML = fn();
}

/* Escrituras */
async function write(col, id, patch, msg) {
  const key = col + '/' + id;
  if (state.busy.has(key)) return;
  state.busy.add(key);
  render();
  try {
    await state.db.collection(col).doc(id).update({ ...patch, actualizado_en: nowIso() });
    if (msg) toast(msg);
  } catch (e) {
    toast(errMsg(e));
  } finally {
    state.busy.delete(key);
    render();
  }
}

async function removeItem(key, id) {
  const col = COL[key];
  const k = col + '/' + id;
  if (state.busy.has(k)) return;
  state.busy.add(k);
  render();
  try {
    if (key === 'borradores') {
      const b = (state.data.borradores || []).find(x => x.id === id);
      await state.db.collection('borradores').doc(id).delete();
      if (b && b.noticia_id) {
        try { await state.db.collection('noticias').doc(b.noticia_id).update({ estado: 'descartada', actualizado_en: nowIso() }); } catch (e) { /* la noticia puede no existir */ }
      }
    } else {
      await state.db.collection(col).doc(id).delete();
    }
    state.confirm = null;
    state.sel = null;
    toast('Eliminado');
  } catch (e) {
    toast(errMsg(e));
  } finally {
    state.busy.delete(k);
    render();
  }
}

async function saveEdit(id) {
  const g = s => document.getElementById(s).value;
  const patch = {
    titulo: g('ed-titulo').trim(),
    slug: g('ed-slug').trim(),
    extracto: g('ed-extracto').trim(),
    etiquetas: g('ed-etiquetas').split(',').map(t => t.trim()).filter(Boolean),
    pie_instagram: g('ed-pie').trim(),
    cuerpo_html: g('ed-cuerpo'),
    editado_por_humano: true,
  };
  if (!patch.titulo) { toast('El titular no puede estar vacío.'); return; }
  if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(patch.slug)) { toast('El slug solo admite minúsculas, números y guiones.'); return; }
  const key = 'borradores/' + id;
  if (state.busy.has(key)) return;
  state.busy.add(key);
  try {
    // Registro de ediciones humanas: el aprendizaje semanal lee esta colección.
    const previo = (state.data.borradores || []).find(x => x.id === id) || {};
    await state.db.collection('ediciones').add({
      borrador_id: id,
      fecha: nowIso(),
      antes: { titulo: previo.titulo, slug: previo.slug, extracto: previo.extracto, etiquetas: previo.etiquetas, pie_instagram: previo.pie_instagram, cuerpo_html: previo.cuerpo_html },
      despues: patch,
    });
    await state.db.collection('borradores').doc(id).update({ ...patch, actualizado_en: nowIso() });
    state.editing = null;
    toast('Cambios guardados');
  } catch (e) {
    toast(errMsg(e));
  } finally {
    state.busy.delete(key);
    render();
  }
}

/* Subida a WordPress: el comentario del visor despierta la sesión que publica */
async function requestUpload(b) {
  const id = b.dataset.id;
  try {
    const comments = window.claude ? await window.claude.use('comments') : null;
    if (comments) await comments.openComposer({ element: b });
  } catch (e) { /* comentarios no disponibles en esta vista */ }
  try {
    await state.db.collection('borradores').doc(id).update({ subida_solicitada: true, subida_solicitada_en: nowIso(), modo: 'publicar', actualizado_en: nowIso() });
    toast('Publicación solicitada. Envía el comentario para lanzarla.');
  } catch (e) {
    toast(errMsg(e));
  }
  render();
}

/* Datos en directo */
function subscribe() {
  const sub = (key, col, after) => {
    state.db.collection(col).onSnapshot(
      snap => {
        state.data[key] = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
        if (after) after();
      },
      e => { if (!state.data[key]) state.data[key] = []; toast(errMsg(e)); render(); }
    );
  };
  // Mientras se edita un borrador no se redibuja, para no borrar lo escrito.
  sub('borradores', 'borradores', () => { if (state.editing) renderNav(); else render(); });
  sub('ideas', 'ideas_evergreen', render);
  sub('metricas', 'metricas', render);
  sub('seo', 'incidencias_seo', render);
  sub('noticias', 'noticias', () => {});
  sub('alertas', 'alertas', render);
  sub('ediciones', 'ediciones', render);
  const s = document.getElementById('sync');
  s.textContent = 'En directo';
  s.classList.add('on');
}

/* Navegación y eventos */
function go(view, id) {
  state.view = view;
  state.sel = id || null;
  state.editing = null;
  state.confirm = null;
  location.hash = view;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function wire() {
  document.getElementById('nav').addEventListener('click', e => {
    const b = e.target.closest('[data-act="nav"]');
    if (b) go(b.dataset.view, null);
  });

  document.getElementById('screen').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === 'open') { go(b.dataset.screen, b.dataset.id); return; }
    if (act === 'select') { state.sel = b.dataset.id; state.confirm = null; render(); return; }
    if (act === 'close') { state.sel = null; state.confirm = null; render(); return; }
    if (act === 'periodo') { state.periodo = b.dataset.p; render(); return; }
    if (act === 'copy') { copy(b.dataset.copy); return; }
    if (act === 'edit') { state.editing = b.dataset.id; state.confirm = null; render(); return; }
    if (act === 'cancel_edit') { state.editing = null; render(); return; }
    if (act === 'save_edit') { saveEdit(b.dataset.id); return; }
    if (act === 'ask_delete') { state.confirm = { key: b.dataset.key, id: b.dataset.id }; render(); return; }
    if (act === 'cancel_delete') { state.confirm = null; render(); return; }
    if (act === 'do_delete') { removeItem(b.dataset.key, b.dataset.id); return; }
    if (act === 'upload') { requestUpload(b); return; }
    const a = ACTIONS[act];
    if (!a) return;
    if (act === 'approve') {
      const borr = (state.data.borradores || []).find(x => x.id === b.dataset.id);
      if (borr && !/^data:image\/webp;base64,|^https:\/\//.test(String(borr.imagen_url || ''))) {
        toast('Falta la portada: no se puede aprobar sin imagen');
        return;
      }
    }
    write(a.col, b.dataset.id, a.patch, a.msg);
  });

  window.addEventListener('hashchange', () => {
    const k = location.hash.slice(1);
    if (VIEWS.some(v => v.key === k) && k !== state.view) go(k, null);
  });
}

(async function init() {
  const h = location.hash.slice(1);
  if (VIEWS.some(v => v.key === h)) state.view = h;
  wire();
  render();
  try {
    const api = window.claude;
    state.db = api ? await api.use('db') : null;
  } catch (e) {
    state.db = null;
  }
  state.ready = true;
  if (state.db) subscribe();
  else document.getElementById('sync').textContent = 'Sin acceso a datos';
  render();
})();
</script>
