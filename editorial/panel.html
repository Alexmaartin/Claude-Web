<title>Panel Editorial UndraftedZone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
:root {
  --bg: #f3f3ef;
  --surface: #ffffff;
  --surface-2: #ebebe5;
  --line: #e0e0d8;
  --fg: #1a1c18;
  --muted: #697064;
  --accent: #b1441a;
  --accent-soft: #f6e6de;
  --on-accent: #ffffff;
  --ok: #2c6638;
  --ok-soft: #e3efe5;
  --warn: #8a5a00;
  --warn-soft: #f5ecd6;
  --bad: #9e2a20;
  --bad-soft: #f5e1de;
  --info: #245e7e;
  --info-soft: #e0edf4;
  --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 8px 24px rgba(0, 0, 0, .06);
  --r: 14px;
  color-scheme: light;
  --serif: "Source Serif 4", Georgia, serif;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111210;
    --surface: #1a1c17;
    --surface-2: #23261f;
    --line: #2f332b;
    --fg: #ece9e1;
    --muted: #9ba192;
    --accent: #f08a55;
    --accent-soft: #3a2519;
    --on-accent: #1a0e04;
    --ok: #86c592;
    --ok-soft: #1f2e22;
    --warn: #e2b660;
    --warn-soft: #33290f;
    --bad: #ef8074;
    --bad-soft: #3a1f1b;
    --info: #8ac3dd;
    --info-soft: #1c2c35;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111210;
  --surface: #1a1c17;
  --surface-2: #23261f;
  --line: #2f332b;
  --fg: #ece9e1;
  --muted: #9ba192;
  --accent: #f08a55;
  --accent-soft: #3a2519;
  --on-accent: #1a0e04;
  --ok: #86c592;
  --ok-soft: #1f2e22;
  --warn: #e2b660;
  --warn-soft: #33290f;
  --bad: #ef8074;
  --bad-soft: #3a1f1b;
  --info: #8ac3dd;
  --info-soft: #1c2c35;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
a { color: var(--accent); }
img { max-width: 100%; display: block; }

/* Cabecera de la app */
.appbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 14px 2px 12px;
  padding-top: max(14px, env(safe-area-inset-top, 0px));
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.kicker { margin: 0; font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.appbar h1 { margin: 4px 0 0; font: 600 24px/1.1 var(--serif); }
.live { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono); color: var(--muted); padding: 6px 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); white-space: nowrap; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live.on::before { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }

/* Navegación inferior en móvil, superior en escritorio */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
.navbtn {
  display: grid; justify-items: center; gap: 3px; padding: 6px 4px; border: 0; background: none; border-radius: 12px;
  font: 500 11px/1 var(--sans); color: var(--muted);
}
.navbtn svg { width: 22px; height: 22px; }
.navbtn[aria-current="true"] { color: var(--accent); }
.navbtn[aria-current="true"] .ico { background: var(--accent-soft); }
.navbtn .ico { display: grid; place-items: center; width: 44px; height: 28px; border-radius: 999px; }
.navbtn .badge { position: relative; }
@media (min-width: 900px) {
  body { padding-bottom: 40px; max-width: 1180px; margin: 0 auto; }
  .nav { position: sticky; top: 0; bottom: auto; left: auto; right: auto; border: 0; border-radius: 0; padding: 10px 0; background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; grid-template-columns: repeat(4, max-content); justify-content: start; gap: 8px; z-index: 6; }
  .navbtn { grid-auto-flow: column; align-items: center; padding: 8px 14px; border-radius: 999px; font-size: 13px; }
  .navbtn .ico { width: auto; height: auto; background: none; }
  .navbtn svg { width: 18px; height: 18px; }
  .navbtn[aria-current="true"] { background: var(--fg); color: var(--bg); }
  .navbtn[aria-current="true"] .ico { background: none; }
  .appbar { display: none; }
}

.screen { display: grid; gap: 14px; padding-top: 4px; min-width: 0; }

/* Tarjetas y bloques */
.card {
  background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow);
  border: 1px solid var(--line); min-width: 0;
}
.sec { display: grid; gap: 10px; min-width: 0; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-head h2 { margin: 0; font: 600 18px/1.2 var(--serif); }
.sec-head span { font: 12px var(--mono); color: var(--muted); }
.hint { margin: 0; color: var(--muted); font-size: 14px; }

/* Propuesta de hoy */
.hero { overflow: hidden; display: grid; }
.hero-img { aspect-ratio: 16 / 9; width: 100%; object-fit: cover; background: linear-gradient(135deg, var(--accent-soft), var(--surface-2)); }
.hero-ph { aspect-ratio: 16 / 9; display: grid; place-items: center; color: var(--muted); font: 500 12px var(--mono); background: var(--surface-2); }
.hero-body { padding: 16px 16px 18px; display: grid; gap: 8px; }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.hero-body h2 { margin: 0; font: 600 21px/1.25 var(--serif); text-wrap: balance; overflow-wrap: anywhere; }
.hero-body p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
.hero.empty .hero-body { color: var(--muted); }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { padding: 14px; display: grid; gap: 6px; min-width: 0; }
.kpi-n { font: 600 24px/1 var(--serif); overflow-wrap: anywhere; }
.kpi-l { font: 500 12px/1.3 var(--sans); color: var(--muted); }
.delta { font: 600 12px var(--mono); }
.up { color: var(--ok); }
.down { color: var(--bad); }
.flat { color: var(--muted); }

/* Chips de filtro */
.chips-filter { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.fchip {
  flex: none; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font: 500 14px var(--sans);
}
.fchip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* Listas */
.list { display: grid; gap: 10px; align-content: start; min-width: 0; }
.item {
  display: grid; gap: 8px; text-align: left; width: 100%; min-width: 0;
  padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
}
.item.is-sel { border-color: var(--accent); }
.item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.item-date { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
.item-title { margin: 0; font: 600 16px/1.3 var(--serif); overflow-wrap: anywhere; }
.item-sub { margin: 0; color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.item-act { display: flex; gap: 8px; flex-wrap: wrap; }

/* Estados */
.estado { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--sans); padding: 5px 10px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.estado::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.e-warn { background: var(--warn-soft); color: var(--warn); }
.e-ok { background: var(--ok-soft); color: var(--ok); }
.e-bad { background: var(--bad-soft); color: var(--bad); }
.e-info { background: var(--info-soft); color: var(--info); }
.e-quiet { background: var(--surface-2); color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { padding: 3px 9px; border-radius: 999px; background: var(--surface-2); font: 12px var(--mono); }

/* Botones */
.btn {
  font: 600 14px var(--sans); padding: 11px 16px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); min-height: 44px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); padding-left: 8px; padding-right: 8px; }
.btn.ghost.danger { color: var(--bad); }
.btn.big { width: 100%; }
.btn:disabled { opacity: .5; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spacer { flex: 1; }
.back { justify-self: start; background: none; border: 0; padding: 6px 0; color: var(--muted); font: 500 14px var(--sans); }

/* Detalle */
.split { display: grid; gap: 14px; min-width: 0; }
.split .detail { display: none; }
.split.has-sel .list { display: none; }
.split.has-sel .detail { display: block; }
@media (min-width: 900px) {
  .split { grid-template-columns: minmax(300px, .85fr) minmax(0, 1.5fr); align-items: start; }
  .split .list, .split .detail { display: grid !important; }
  .split .list { position: sticky; top: 12px; max-height: calc(100vh - 110px); overflow-y: auto; padding-right: 4px; }
  .split .detail { position: sticky; top: 12px; max-height: calc(100vh - 110px); overflow-y: auto; }
}
.detail-in { padding: 16px; display: grid; gap: 16px; min-width: 0; }
.dtitle { margin: 0; font: 600 24px/1.2 var(--serif); text-wrap: balance; overflow-wrap: anywhere; }
.dmeta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; color: var(--muted); font-size: 13px; }
.block { display: grid; gap: 6px; min-width: 0; }
.block-label { font: 500 11px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.block p, .block ul { margin: 0; overflow-wrap: anywhere; }
.block ul { padding-left: 18px; }
.copy { font: 500 12px var(--sans); padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
code.slug { font: 14px var(--mono); overflow-wrap: anywhere; background: var(--surface-2); padding: 5px 9px; border-radius: 8px; justify-self: start; }
.article { border-radius: 12px; padding: 18px; background: var(--bg); border: 1px solid var(--line); min-width: 0; }
.articulo { font: 16px/1.65 var(--serif); overflow-wrap: anywhere; }
.articulo h3, .articulo h4 { font-family: var(--sans); line-height: 1.3; margin: 1.4em 0 .4em; }
.articulo h3 { font-size: 18px; }
.articulo h4 { font-size: 15px; }
.articulo p { margin: 0 0 1em; }
.articulo ul { padding-left: 20px; margin: 0 0 1em; }
.articulo a { color: var(--accent); }
details.raw summary { cursor: pointer; color: var(--muted); font: 500 13px var(--sans); }
pre.preview { max-height: 260px; overflow: auto; margin: 8px 0 0; padding: 10px; border-radius: 8px; background: var(--surface-2); font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.confirm { display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: var(--bad-soft); }
.confirm p { margin: 0; }

/* Edición */
.ed { width: 100%; font: 15px/1.5 var(--sans); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); }
.ed.mono { font: 13px/1.45 var(--mono); }
.field { display: grid; gap: 6px; min-width: 0; }

/* Métricas */
.bars { display: flex; align-items: flex-end; gap: 4px; height: 160px; overflow-x: auto; padding-bottom: 2px; }
.bar { flex: 1 0 14px; min-width: 14px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; }
.bar i { width: 100%; background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 60%, transparent)); border-radius: 6px 6px 2px 2px; min-height: 3px; }
.bar em { font: 10px var(--mono); font-style: normal; color: var(--muted); white-space: nowrap; }
.brow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
.brow span { overflow-wrap: anywhere; font-size: 14px; }
.brow b { font: 600 13px var(--mono); }
.btrack { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.btrack i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.btrack.ig i { background: var(--info); }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rank li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.rank li:last-child { border-bottom: 0; }
.rank li span, .rank li a { overflow-wrap: anywhere; font-size: 14px; min-width: 0; }
.rank li b { font: 600 14px var(--mono); white-space: nowrap; }
.rank .n { font: 600 12px var(--mono); color: var(--muted); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.tbl td:not(:first-child), .tbl th:not(:first-child) { text-align: right; white-space: nowrap; }
.tbl td:first-child { overflow-wrap: anywhere; max-width: 180px; }
.flag { display: inline-block; margin-left: 6px; padding: 2px 6px; border-radius: 6px; font: 500 11px var(--sans); background: var(--warn-soft); color: var(--warn); }
.pending { display: grid; gap: 6px; padding: 16px; border-radius: 12px; border: 1px dashed var(--line); color: var(--muted); font-size: 14px; }
.pending strong { color: var(--fg); font: 600 15px var(--sans); }
.foot { font: 12px var(--mono); color: var(--muted); text-align: center; }

/* Vacío */
.empty { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 36px 20px; color: var(--muted); border-radius: var(--r); border: 1px dashed var(--line); }
.empty strong { color: var(--fg); font: 600 18px/1.3 var(--serif); }

.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
  max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 12px; background: var(--fg); color: var(--bg); font: 14px var(--sans); box-shadow: var(--shadow);
}
@media (min-width: 900px) { .toast { bottom: 24px; } }
@media (max-width: 560px) { .kpis { grid-template-columns: 1fr 1fr; } .kpis .kpi:last-child { grid-column: 1 / -1; } }
</style>

<header class="appbar">
  <div>
    <p class="kicker">UndraftedZone</p>
    <h1 id="screen-title">Hoy</h1>
  </div>
  <span class="live" id="sync">Conectando</span>
</header>

<nav class="nav" id="nav" aria-label="Secciones"></nav>
<main class="screen" id="screen"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nowIso = () => new Date().toISOString();
const nf = new Intl.NumberFormat('es-ES');
const fmt = v => (v === undefined || v === null || v === '') ? '—' : (typeof v === 'number' ? nf.format(v) : esc(v));

const VIEWS = [
  { key: 'hoy', label: 'Hoy', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>' },
  { key: 'borradores', label: 'Borradores', col: 'borradores', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>', open: x => x.estado === 'pendiente_revision' },
  { key: 'ideas', label: 'Ideas', col: 'ideas_evergreen', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.6 1 2.5h6c0-.9.2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg>', open: x => x.estado === 'propuesta' },
  { key: 'metricas', label: 'Métricas', col: 'metricas', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>' },
];
const VIEW_TITLE = Object.fromEntries(VIEWS.map(v => [v.key, v.label]));
const COL = { borradores: 'borradores', ideas: 'ideas_evergreen', metricas: 'metricas', seo: 'incidencias_seo', noticias: 'noticias' };

const ESTADO = {
  pendiente_revision: ['warn', 'Pendiente'], aprobado: ['ok', 'Aprobado'], publicado_borrador: ['ok', 'En WordPress'],
  publicado: ['ok', 'Publicado'], devuelto: ['bad', 'Devuelto'],
  propuesta: ['info', 'Propuesta'], aprobada: ['ok', 'Aprobada'], usada: ['quiet', 'Usada'], denegada: ['quiet', 'Denegada'],
  abierta: ['warn', 'Abierta'], resuelta: ['ok', 'Resuelta'], ignorada: ['quiet', 'Ignorada'],
  nueva: ['info', 'Nueva'], descartada: ['quiet', 'Descartada'],
};

const ACTIONS = {
  approve: { col: 'borradores', patch: { estado: 'aprobado' }, msg: 'Borrador aprobado' },
  return: { col: 'borradores', patch: { estado: 'devuelto' }, msg: 'Devuelto para cambios' },
  approve_idea: { col: 'ideas_evergreen', patch: { estado: 'aprobada' }, msg: 'Idea aprobada: se redactará en el próximo día evergreen' },
  deny_idea: { col: 'ideas_evergreen', patch: { estado: 'denegada' }, msg: 'Idea denegada' },
  resolve_seo: { col: 'incidencias_seo', patch: { estado: 'resuelta' }, msg: 'Incidencia resuelta' },
  ignore_seo: { col: 'incidencias_seo', patch: { estado: 'ignorada' }, msg: 'Incidencia ignorada' },
};

const state = { ready: false, db: null, view: 'hoy', sel: null, editing: null, confirm: null, periodo: 'semana', data: {}, busy: new Set() };
['borradores', 'ideas', 'metricas', 'seo', 'noticias'].forEach(k => { state.data[k] = null; });

/* Utilidades */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.hidden = true; }, 2600);
}
function errMsg(e) {
  if (e && (e.code === 'not_granted' || e.code === 'revoked')) return 'No tienes permiso para editar este panel.';
  if (e && e.code === 'invalid_argument') return 'No se pudo guardar: el elemento ya no existe o no es válido.';
  return 'Sin conexión con la base de datos. Inténtalo de nuevo.';
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  return isNaN(d) ? String(s) : d.toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function sortDesc(list) {
  return [...list].sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
}
function safeLink(u) {
  const s = String(u ?? '');
  return /^https:\/\//.test(s) ? '<a href="' + esc(s) + '" target="_blank" rel="noopener noreferrer">' + esc(s) + '</a>' : esc(s || '—');
}
const TAGS_OK = new Set(['P', 'H2', 'H3', 'H4', 'UL', 'OL', 'LI', 'STRONG', 'EM', 'A', 'BLOCKQUOTE', 'BR']);
// Deja solo marcado de artículo seguro: sin scripts, sin atributos salvo enlaces https.
function sanitize(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  (function clean(parent) {
    for (const node of [...parent.childNodes]) {
      if (node.nodeType === 3) continue;
      if (node.nodeType !== 1) { node.remove(); continue; }
      clean(node);
      if (!TAGS_OK.has(node.tagName)) { node.replaceWith(...node.childNodes); continue; }
      for (const attr of [...node.attributes]) node.removeAttribute(attr.name);
      if (node.tagName === 'A') {
        const href = node.getAttribute('href') || '';
        if (/^https:\/\//.test(href)) { node.setAttribute('href', href); node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); }
      }
    }
  })(tpl.content);
  return tpl.innerHTML;
}
function estado(e) {
  const [cls, label] = ESTADO[e] || ['quiet', String(e || '—').replace(/_/g, ' ')];
  return '<span class="estado e-' + cls + '">' + esc(label) + '</span>';
}
function copyBtn(text) {
  return text ? '<button class="copy" data-act="copy" data-copy="' + esc(text) + '">Copiar</button>' : '';
}
function block(label, html, copyText) {
  return '<div class="block"><div class="block-label"><span>' + esc(label) + '</span>' + copyBtn(copyText) + '</div>' + html + '</div>';
}
function copy(text) {
  try {
    navigator.clipboard.writeText(text).then(() => toast('Copiado'), () => toast('No se pudo copiar. Selecciona el texto.'));
  } catch (e) {
    toast('No se pudo copiar. Selecciona el texto.');
  }
}
function btn(act, id, label, primary) {
  const busy = state.busy.has(ACTIONS[act].col + '/' + id);
  return '<button class="btn' + (primary ? ' primary' : '') + '" data-act="' + act + '" data-id="' + esc(id) + '"' + (busy ? ' disabled' : '') + '>' + esc(label) + '</button>';
}
function emptyBox(title, text) {
  return '<div class="empty"><strong>' + esc(title) + '</strong><span>' + esc(text) + '</span></div>';
}
function deleteBlock(key, id) {
  const c = state.confirm && state.confirm.key === key && state.confirm.id === id;
  if (c) {
    const extra = key === 'borradores' ? ' La noticia de origen pasa a descartada, para que no se vuelva a redactar.' : '';
    return '<div class="confirm"><p><strong>¿Eliminar este elemento?</strong> No se puede deshacer.' + esc(extra) + '</p>'
      + '<div class="actions"><button class="btn danger" data-act="do_delete" data-key="' + key + '" data-id="' + esc(id) + '">Sí, eliminar</button>'
      + '<button class="btn" data-act="cancel_delete">Cancelar</button></div></div>';
  }
  return '<div class="actions"><span class="spacer"></span><button class="btn ghost danger" data-act="ask_delete" data-key="' + key + '" data-id="' + esc(id) + '">Eliminar</button></div>';
}

/* Métricas: lectura del documento web */
function metricsDoc() {
  return (state.data.metricas || []).find(x => x.id === 'web') || null;
}
function periodoDatos(p) {
  const d = metricsDoc();
  return d && d.periodos ? (d.periodos[p] || {}) : {};
}
function deltaHtml(actual, previo) {
  if (typeof actual !== 'number' || typeof previo !== 'number' || previo === 0) return '<span class="delta flat">sin comparar</span>';
  const pct = Math.round((actual - previo) / previo * 100);
  const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
  const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '•';
  return '<span class="delta ' + cls + '">' + arrow + ' ' + Math.abs(pct) + ' %</span>';
}
function cambioHtml(c) {
  if (typeof c !== 'number') return '<span class="delta flat">—</span>';
  const cls = c > 0 ? 'up' : c < 0 ? 'down' : 'flat';
  const arrow = c > 0 ? '▲' : c < 0 ? '▼' : '•';
  return '<span class="delta ' + cls + '">' + arrow + ' ' + Math.abs(c) + ' %</span>';
}
const PERIODOS = [['dia', 'Día'], ['semana', 'Semana'], ['mes', 'Mes']];

function barraProcedencia(origen, visitas, total) {
  const pct = total ? Math.round(visitas / total * 100) : 0;
  const cls = /instagram/i.test(origen) ? ' ig' : '';
  return '<div class="brow"><span>' + esc(origen) + '</span><b>' + fmt(visitas) + ' · ' + pct + ' %</b>'
    + '<div class="btrack' + cls + '"><i style="width:' + pct + '%"></i></div></div>';
}

function renderMetricas() {
  const d = metricsDoc();
  const chips = '<div class="chips-filter" role="group" aria-label="Periodo">'
    + PERIODOS.map(([k, l]) => '<button class="fchip" data-act="periodo" data-p="' + k + '" aria-pressed="' + (state.periodo === k) + '">' + l + '</button>').join('')
    + '</div>';
  if (!d) return chips + emptyBox('Sin métricas todavía', 'Se rellenan en la pasada diaria con datos de Cloudflare y WordPress.');
  const p = periodoDatos(state.periodo);
  const serie = p.serie || [];
  const max = Math.max(1, ...serie.map(s => s.visitas || 0));
  const bars = serie.length
    ? '<div class="bars">' + serie.map(s => '<div class="bar" title="' + esc(s.dia) + ': ' + fmt(s.visitas) + '"><i style="height:' + Math.round((s.visitas || 0) / max * 100) + '%"></i><em>' + esc(String(s.dia || '').slice(-5)) + '</em></div>').join('') + '</div>'
    : '<p class="hint">Sin serie para este periodo todavía.</p>';
  const proc = p.procedencia || [];
  const totalProc = proc.reduce((a, o) => a + (o.visitas || 0), 0);
  const procHtml = proc.length
    ? proc.map(o => barraProcedencia(o.origen, o.visitas, totalProc)).join('')
    : '<p class="hint">Sin datos de procedencia todavía.</p>';
  const top = (p.top || []).slice(0, 10).map((r, i) => '<li><span class="n">' + (i + 1) + '</span><span>' + esc(r.ruta) + '</span><b>' + fmt(r.visitas) + ' ' + cambioHtml(r.cambio) + '</b></li>').join('');
  const arts = (p.articulos || []).slice(0, 5).map((a, i) => '<li><span class="n">' + (i + 1) + '</span><a href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">' + esc(a.titulo) + '</a><b>' + fmt(a.vistas) + '</b></li>').join('');
  const sc = (d.search_console || []).slice(0, 15);
  const scHtml = sc.length
    ? '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Página</th><th>Impr.</th><th>CTR</th><th>Pos.</th></tr></thead><tbody>'
      + sc.map(r => {
        const flag = (r.impresiones >= 500 && r.ctr < 2) ? '<span class="flag">título</span>' : '';
        return '<tr><td>' + esc(r.pagina) + flag + '</td><td>' + fmt(r.impresiones) + '</td><td>' + esc(r.ctr) + ' %</td><td>' + esc(r.posicion) + '</td></tr>';
      }).join('') + '</tbody></table></div>'
    : '<div class="pending"><strong>Search Console pendiente</strong><span>Faltan las credenciales de la cuenta de servicio de Google para mostrar impresiones, CTR y posición.</span></div>';
  const sp = (d.velocidad_movil || []).slice(0, 10);
  const spHtml = sp.length
    ? '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Página</th><th>Puntuación</th><th>LCP</th><th>Cambio</th></tr></thead><tbody>'
      + sp.map(r => {
        const flag = (typeof r.cambio === 'number' && r.cambio < -5) ? '<span class="flag">empeora</span>' : '';
        return '<tr><td>' + esc(r.pagina) + flag + '</td><td>' + fmt(r.puntuacion) + '</td><td>' + fmt(r.lcp_ms) + ' ms</td><td>' + cambioHtml(r.cambio) + '</td></tr>';
      }).join('') + '</tbody></table></div>'
    : '<div class="pending"><strong>Velocidad en móvil pendiente</strong><span>Falta la clave de PageSpeed Insights para medir la velocidad real en móvil y escritorio.</span></div>';
  return chips
    + '<div class="kpis">'
    + '<div class="card kpi"><span class="kpi-n">' + fmt(p.visitas) + '</span><span class="kpi-l">Visitas ' + deltaHtml(p.visitas, p.visitas_previas) + '</span></div>'
    + '<div class="card kpi"><span class="kpi-n">' + fmt(p.peticiones) + '</span><span class="kpi-l">Peticiones</span></div>'
    + '<div class="card kpi"><span class="kpi-n">' + fmt(d.articulos_publicados) + '</span><span class="kpi-l">Artículos publicados</span></div>'
    + '</div>'
    + '<section class="card sec" style="padding:16px"><div class="sec-head"><h2>Visitas</h2><span>' + esc(PERIODOS.find(x => x[0] === state.periodo)[1]) + '</span></div>' + bars + '</section>'
    + '<section class="card sec" style="padding:16px"><div class="sec-head"><h2>De dónde llegan</h2><span>' + fmt(totalProc) + ' visitas</span></div>' + procHtml + '</section>'
    + '<section class="card sec" style="padding:16px"><div class="sec-head"><h2>Qué sube y qué cae</h2><span>vs. periodo anterior</span></div><ol class="rank">' + (top || '<li><span>Sin datos todavía</span></li>') + '</ol></section>'
    + '<section class="card sec" style="padding:16px"><div class="sec-head"><h2>Artículos con más impacto</h2><span>vistas</span></div><ol class="rank">' + (arts || '<li><span>Sin datos todavía</span></li>') + '</ol></section>'
    + '<section class="card sec" style="padding:16px"><div class="sec-head"><h2>Search Console</h2><span>últimos 28 días</span></div>' + scHtml + '</section>'
    + '<section class="card sec" style="padding:16px"><div class="sec-head"><h2>Velocidad</h2><span>datos reales</span></div>' + spHtml + '</section>'
    + '<p class="foot">Actualizado ' + esc(fmtDate(d.actualizado)) + '</p>';
}

/* Escrituras */
async function write(col, id, patch, msg) {
  const key = col + '/' + id;
  if (state.busy.has(key)) return;
  state.busy.add(key);
  render();
  try {
    await state.db.collection(col).doc(id).update({ ...patch, actualizado_en: nowIso() });
    if (msg) toast(msg);
  } catch (e) {
    toast(errMsg(e));
  } finally {
    state.busy.delete(key);
    render();
  }
}

async function removeItem(key, id) {
  const col = COL[key];
  const k = col + '/' + id;
  if (state.busy.has(k)) return;
  state.busy.add(k);
  render();
  try {
    if (key === 'borradores') {
      const b = (state.data.borradores || []).find(x => x.id === id);
      await state.db.collection('borradores').doc(id).delete();
      if (b && b.noticia_id) {
        try { await state.db.collection('noticias').doc(b.noticia_id).update({ estado: 'descartada', actualizado_en: nowIso() }); } catch (e) { /* la noticia puede no existir */ }
      }
    } else {
      await state.db.collection(col).doc(id).delete();
    }
    state.confirm = null;
    state.sel = null;
    toast('Eliminado');
  } catch (e) {
    toast(errMsg(e));
  } finally {
    state.busy.delete(k);
    render();
  }
}

async function saveEdit(id) {
  const g = s => document.getElementById(s).value;
  const patch = {
    titulo: g('ed-titulo').trim(),
    slug: g('ed-slug').trim(),
    extracto: g('ed-extracto').trim(),
    etiquetas: g('ed-etiquetas').split(',').map(t => t.trim()).filter(Boolean),
    pie_instagram: g('ed-pie').trim(),
    cuerpo_html: g('ed-cuerpo'),
    editado_por_humano: true,
  };
  if (!patch.titulo) { toast('El titular no puede estar vacío.'); return; }
  if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(patch.slug)) { toast('El slug solo admite minúsculas, números y guiones.'); return; }
  const key = 'borradores/' + id;
  if (state.busy.has(key)) return;
  state.busy.add(key);
  try {
    // Registro de ediciones humanas: el aprendizaje semanal lee esta colección.
    const previo = (state.data.borradores || []).find(x => x.id === id) || {};
    await state.db.collection('ediciones').add({
      borrador_id: id,
      fecha: nowIso(),
      antes: { titulo: previo.titulo, slug: previo.slug, extracto: previo.extracto, etiquetas: previo.etiquetas, pie_instagram: previo.pie_instagram, cuerpo_html: previo.cuerpo_html },
      despues: patch,
    });
    await state.db.collection('borradores').doc(id).update({ ...patch, actualizado_en: nowIso() });
    state.editing = null;
    toast('Cambios guardados');
  } catch (e) {
    toast(errMsg(e));
  } finally {
    state.busy.delete(key);
    render();
  }
}

/* Subida a WordPress: el comentario del visor despierta la sesión que publica */
async function requestUpload(b) {
  const id = b.dataset.id;
  try {
    const comments = window.claude ? await window.claude.use('comments') : null;
    if (comments) await comments.openComposer({ element: b });
  } catch (e) { /* comentarios no disponibles en esta vista */ }
  try {
    await state.db.collection('borradores').doc(id).update({ subida_solicitada: true, subida_solicitada_en: nowIso(), modo: 'publicar', actualizado_en: nowIso() });
    toast('Publicación solicitada. Envía el comentario para lanzarla.');
  } catch (e) {
    toast(errMsg(e));
  }
  render();
}

/* Datos en directo */
function subscribe() {
  const sub = (key, col, after) => {
    state.db.collection(col).onSnapshot(
      snap => {
        state.data[key] = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
        if (after) after();
      },
      e => { if (!state.data[key]) state.data[key] = []; toast(errMsg(e)); render(); }
    );
  };
  // Mientras se edita un borrador no se redibuja, para no borrar lo escrito.
  sub('borradores', 'borradores', () => { if (state.editing) renderNav(); else render(); });
  sub('ideas', 'ideas_evergreen', render);
  sub('metricas', 'metricas', render);
  sub('seo', 'incidencias_seo', render);
  sub('noticias', 'noticias', () => {});
  const s = document.getElementById('sync');
  s.textContent = 'En directo';
  s.classList.add('on');
}

/* Navegación y eventos */
function go(view, id) {
  state.view = view;
  state.sel = id || null;
  state.editing = null;
  state.confirm = null;
  location.hash = view;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function wire() {
  document.getElementById('nav').addEventListener('click', e => {
    const b = e.target.closest('[data-act="nav"]');
    if (b) go(b.dataset.view, null);
  });

  document.getElementById('screen').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === 'open') { go(b.dataset.screen, b.dataset.id); return; }
    if (act === 'select') { state.sel = b.dataset.id; state.confirm = null; render(); return; }
    if (act === 'close') { state.sel = null; state.confirm = null; render(); return; }
    if (act === 'periodo') { state.periodo = b.dataset.p; render(); return; }
    if (act === 'copy') { copy(b.dataset.copy); return; }
    if (act === 'edit') { state.editing = b.dataset.id; state.confirm = null; render(); return; }
    if (act === 'cancel_edit') { state.editing = null; render(); return; }
    if (act === 'save_edit') { saveEdit(b.dataset.id); return; }
    if (act === 'ask_delete') { state.confirm = { key: b.dataset.key, id: b.dataset.id }; render(); return; }
    if (act === 'cancel_delete') { state.confirm = null; render(); return; }
    if (act === 'do_delete') { removeItem(b.dataset.key, b.dataset.id); return; }
    if (act === 'upload') { requestUpload(b); return; }
    const a = ACTIONS[act];
    if (!a) return;
    write(a.col, b.dataset.id, a.patch, a.msg);
  });

  window.addEventListener('hashchange', () => {
    const k = location.hash.slice(1);
    if (VIEWS.some(v => v.key === k) && k !== state.view) go(k, null);
  });
}

(async function init() {
  const h = location.hash.slice(1);
  if (VIEWS.some(v => v.key === h)) state.view = h;
  wire();
  render();
  try {
    const api = window.claude;
    state.db = api ? await api.use('db') : null;
  } catch (e) {
    state.db = null;
  }
  state.ready = true;
  if (state.db) subscribe();
  else document.getElementById('sync').textContent = 'Sin acceso a datos';
  render();
})();
</script>
