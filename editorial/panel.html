<title>Panel Editorial UndraftedZone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="UZ Panel">
<meta name="application-name" content="UZ Panel">
<meta name="theme-color" content="#0b1b4d">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: cabecera con saludo, tarjetas blandas y mucho aire. Móvil con barra inferior; escritorio con pestañas arriba. */
:root {
  --bg: #f2f5fb;
  --surface: #ffffff;
  --surface-2: #eaeff9;
  --line: #dde3f0;
  --line-2: #c9d1e6;
  --fg: #141a2e;
  --muted: #566080;
  --accent: #2c54ee;
  --accent-soft: #e4eaff;
  --on-accent: #ffffff;
  --court: #d9480f;
  --court-soft: #ffe9dc;
  --ok: #0c7451;
  --ok-soft: #dcf3e8;
  --warn: #94560a;
  --warn-soft: #fdefd2;
  --bad: #b3302a;
  --bad-soft: #fde3e0;
  --info: #1a6498;
  --info-soft: #dcecf8;
  --shadow-sm: 0 1px 2px rgba(20, 26, 46, .06);
  --shadow: 0 1px 2px rgba(20, 26, 46, .05), 0 14px 30px -16px rgba(20, 26, 46, .22);
  --r: 20px;
  --r-sm: 12px;
  color-scheme: light;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Source Serif 4", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1020;
    --surface: #161a2e;
    --surface-2: #1f2441;
    --line: #293050;
    --line-2: #39416b;
    --fg: #edf0fb;
    --muted: #a3abc9;
    --accent: #8ba5ff;
    --accent-soft: #212a58;
    --on-accent: #0b1030;
    --court: #ff9552;
    --court-soft: #3a2313;
    --ok: #72d8a9;
    --ok-soft: #142f29;
    --warn: #f1c263;
    --warn-soft: #33290f;
    --bad: #ff948c;
    --bad-soft: #3b2022;
    --info: #8fcdf3;
    --info-soft: #172a3b;
    --shadow-sm: none;
    --shadow: 0 14px 30px -16px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1020;
  --surface: #161a2e;
  --surface-2: #1f2441;
  --line: #293050;
  --line-2: #39416b;
  --fg: #edf0fb;
  --muted: #a3abc9;
  --accent: #8ba5ff;
  --accent-soft: #212a58;
  --on-accent: #0b1030;
  --court: #ff9552;
  --court-soft: #3a2313;
  --ok: #72d8a9;
  --ok-soft: #142f29;
  --warn: #f1c263;
  --warn-soft: #33290f;
  --bad: #ff948c;
  --bad-soft: #3b2022;
  --info: #8fcdf3;
  --info-soft: #172a3b;
  --shadow-sm: none;
  --shadow: 0 14px 30px -16px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px));
  min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
a { color: var(--accent); text-underline-offset: 3px; }
img { max-width: 100%; display: block; }
h1, h2, h3 { text-wrap: balance; }

/* Cabecera */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 14px 0 12px;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(12px) saturate(1.2);
  -webkit-backdrop-filter: blur(12px) saturate(1.2);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo {
  width: 42px; height: 42px; border-radius: 14px; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; flex: none; box-shadow: 0 8px 18px -10px var(--accent);
}
.logo svg { width: 24px; height: 24px; }
.kicker { margin: 0; font: 600 12px/1.2 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.top h1 { margin: 2px 0 0; font: 700 22px/1.1 var(--display); letter-spacing: -.01em; }
.live {
  display: inline-flex; align-items: center; gap: 8px; font: 600 13px var(--sans); color: var(--muted);
  padding: 8px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap;
}
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.live.on::before { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }

/* Navegación */
.nav {
  position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(14px) saturate(1.3);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow);
}
.navbtn {
  position: relative; display: grid; justify-items: center; gap: 4px; padding: 9px 4px 8px; border: 0; background: none; border-radius: 20px;
  font: 600 11px/1.1 var(--sans); color: var(--muted); transition: color .2s, background .2s, transform .1s;
}
.navbtn:active { transform: scale(.96); }
.navbtn svg { width: 24px; height: 24px; }
.navbtn[aria-current="true"] { color: var(--accent); background: var(--accent-soft); }
.navbtn .badge {
  position: absolute; top: 3px; right: calc(50% - 30px); min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
  background: var(--court); color: #fff; font: 700 12px/20px var(--sans); text-align: center; box-shadow: 0 0 0 3px var(--surface);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .navbtn .badge { color: #1a0d04; } }
:root[data-theme="dark"] .navbtn .badge { color: #1a0d04; }
@media (min-width: 900px) {
  body { padding-bottom: 56px; max-width: 1160px; margin: 0 auto; }
  .top { position: static; background: none; backdrop-filter: none; -webkit-backdrop-filter: none; padding: 22px 0 10px; }
  .nav {
    position: sticky; top: env(safe-area-inset-top, 0px); left: auto; right: auto; bottom: auto; z-index: 6;
    grid-template-columns: repeat(5, max-content); justify-content: start; gap: 6px; padding: 8px 0 14px;
    background: var(--bg); border: 0; border-radius: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  .navbtn { grid-auto-flow: column; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 999px; font-size: 15px; }
  .navbtn svg { width: 20px; height: 20px; }
  .navbtn[aria-current="true"] { background: var(--accent); color: var(--on-accent); }
  .navbtn .badge { position: static; box-shadow: none; }
}

.screen { display: grid; gap: 20px; padding-top: 6px; min-width: 0; animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen, .toast { animation: none; } * { transition: none !important; } }

/* Piezas comunes */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--line); min-width: 0; }
.sec { display: grid; gap: 14px; min-width: 0; scroll-margin-top: 80px; }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sec-head h2 { margin: 0; font: 700 21px/1.2 var(--display); letter-spacing: -.01em; }
.sec-head span:not(.count) { font: 600 13px var(--sans); color: var(--muted); }
.count { font: 700 13px var(--sans); min-width: 28px; text-align: center; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.hint { margin: 0; color: var(--muted); font-size: 15px; }
.eyebrow { font: 700 12px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--court); }

/* Saludo */
.welcome { padding: 24px 22px 22px; display: grid; gap: 10px; }
.welcome .fecha { margin: 0; font: 600 13px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.welcome h2 { margin: 0; font: 700 clamp(28px, 6vw, 38px)/1.08 var(--display); letter-spacing: -.02em; }
.welcome .resumen { margin: 0; color: var(--muted); font-size: 17px; max-width: 52ch; }
.todo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
@media (min-width: 640px) { .todo { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile {
  display: grid; gap: 2px; text-align: left; padding: 14px 14px 12px; border-radius: 16px; border: 1px solid transparent;
  background: var(--surface-2); min-width: 0; transition: transform .15s, box-shadow .15s;
}
button.tile:not(:disabled):hover { transform: translateY(-2px); box-shadow: var(--shadow); }
button.tile:not(:disabled):active { transform: scale(.98); }
.tile b { font: 700 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.tile span { font: 600 13px/1.3 var(--sans); color: var(--muted); }
.tile.t-accent { background: var(--accent-soft); }
.tile.t-accent b { color: var(--accent); }
.tile.t-court { background: var(--court-soft); }
.tile.t-court b { color: var(--court); }
.tile.t-info { background: var(--info-soft); }
.tile.t-info b { color: var(--info); }
.tile.t-warn { background: var(--warn-soft); }
.tile.t-warn b { color: var(--warn); }
.tile:disabled { cursor: default; opacity: .75; }
.tile:disabled b { color: var(--muted); }

/* Propuesta destacada */
.hero { overflow: hidden; display: grid; }
.hero-media { position: relative; background: var(--accent-soft); aspect-ratio: 16 / 9; display: grid; place-items: center; }
.hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-body { padding: 20px 22px 22px; display: grid; gap: 12px; }
.hero-body h2 { margin: 0; font: 700 clamp(23px, 4.6vw, 30px)/1.15 var(--display); letter-spacing: -.015em; overflow-wrap: anywhere; }
.hero-body p { margin: 0; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hero.vacio { padding: 8px 0; }
@media (min-width: 900px) {
  .hero:not(.vacio) { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
  .hero-media { aspect-ratio: auto; min-height: 300px; }
  .hero-body { align-content: center; padding: 28px; }
}

/* Píldoras */
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1 var(--sans); padding: 8px 12px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.pill svg { width: 16px; height: 16px; flex: none; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }

/* Pulso del ciclo */
.panel { padding: 20px 22px; display: grid; gap: 14px; min-width: 0; }
.pulse { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.pulse li { display: grid; grid-template-columns: 28px minmax(0, 1fr); column-gap: 12px; row-gap: 2px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.pulse li:last-child { border-bottom: 0; }
.pulse .ico { grid-row: 1 / span 2; align-self: start; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); }
.pulse li.off .ico { background: var(--warn-soft); color: var(--warn); }
.pulse .ico svg { width: 16px; height: 16px; }
.pulse em { grid-column: 2; font-style: normal; font-size: 14px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.pulse li > span:nth-child(2) { font-weight: 600; }

/* Tarjetas de lista */
.list { display: grid; gap: 12px; align-content: start; min-width: 0; }
.item {
  display: grid; gap: 12px; text-align: left; width: 100%; min-width: 0; padding: 18px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm);
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
button.item:hover { border-color: var(--line-2); box-shadow: var(--shadow); transform: translateY(-2px); }
button.item:active { transform: scale(.99); }
.item.is-sel { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.item-head { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; }
.bubble { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.bubble svg { width: 22px; height: 22px; }
.bubble.court { background: var(--court-soft); color: var(--court); }
.bubble.info { background: var(--info-soft); color: var(--info); }
.bubble.warn { background: var(--warn-soft); color: var(--warn); }
.item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.item-date { font: 600 13px var(--sans); color: var(--muted); white-space: nowrap; }
.item-title { margin: 4px 0 0; font: 700 18px/1.28 var(--display); letter-spacing: -.005em; overflow-wrap: anywhere; }
.item-sub { margin: 0; color: var(--muted); font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.item-act { display: flex; gap: 10px; flex-wrap: wrap; }
.draft { grid-template-columns: 84px minmax(0, 1fr); align-items: start; gap: 14px; }
.thumb { width: 84px; aspect-ratio: 1; border-radius: 14px; object-fit: cover; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); overflow: hidden; }
.thumb svg { width: 34px; height: 34px; }
.draft-main { display: grid; gap: 8px; min-width: 0; }
.draft-main .item-title { margin: 0; }
.draft .chips, .draft .item-sub { grid-column: 1 / -1; }

/* Estados */
.estado { display: inline-flex; align-items: center; gap: 6px; font: 700 12px/1 var(--sans); padding: 7px 11px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.estado::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.e-warn { background: var(--warn-soft); color: var(--warn); }
.e-ok { background: var(--ok-soft); color: var(--ok); }
.e-bad { background: var(--bad-soft); color: var(--bad); }
.e-info { background: var(--info-soft); color: var(--info); }
.e-quiet { background: var(--surface-2); color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { padding: 5px 11px; border-radius: 999px; background: var(--surface-2); font: 600 13px var(--sans); color: var(--muted); }

/* Botones */
.btn {
  font: 700 15px var(--sans); padding: 12px 20px; border-radius: 14px; border: 1px solid var(--line-2);
  background: var(--surface); min-height: 48px; transition: background .15s, transform .1s, border-color .15s, box-shadow .15s;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 10px 20px -12px var(--accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 90%, #000); border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); padding-left: 12px; padding-right: 12px; min-height: 44px; }
.btn.ghost.danger { color: var(--bad); }
.btn.big { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spacer { flex: 1; }
.back { justify-self: start; display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 8px 0; color: var(--muted); font: 600 15px var(--sans); }
.back:hover { color: var(--fg); }
.back svg { width: 18px; height: 18px; }

/* Filtros */
.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 5px;
  background: var(--surface-2); border-radius: 999px;
}
.seg button {
  padding: 10px 8px; border: 0; border-radius: 999px; background: none; font: 600 13px var(--sans); color: var(--muted);
  transition: background .2s, color .2s; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
.seg .n { margin-left: 4px; font-weight: 700; color: var(--accent); }

/* Lista y detalle */
.split { display: grid; gap: 16px; min-width: 0; }
.split .detail { display: none; }
.split.has-sel .listcol { display: none; }
.split.has-sel .detail { display: block; }
.listcol { display: grid; gap: 14px; align-content: start; min-width: 0; }
@media (min-width: 900px) {
  .split { grid-template-columns: minmax(320px, .8fr) minmax(0, 1.5fr); align-items: start; gap: 22px; }
  .split .listcol, .split .detail { display: grid !important; }
  .split .listcol { position: sticky; top: 76px; max-height: calc(100vh - 100px); overflow-y: auto; padding: 4px 6px 4px 2px; }
  .split .detail { position: sticky; top: 76px; max-height: calc(100vh - 100px); overflow-y: auto; }
}
.detail-in { padding: 0 0 24px; display: grid; gap: 20px; min-width: 0; }
.detail-in > :not(.cover) { margin-left: 22px; margin-right: 22px; }
.detail-in > .back:first-child { margin-top: 14px; }
.cover { aspect-ratio: 16 / 9; background: var(--accent-soft); overflow: hidden; border-radius: var(--r) var(--r) 0 0; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.dtitle { margin: 0; font: 700 clamp(25px, 5vw, 32px)/1.14 var(--display); letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere; }
.dmeta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; color: var(--muted); font-size: 14px; }
.block { display: grid; gap: 10px; min-width: 0; }
.block-label { font: 700 12px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.block p, .block ul { margin: 0; overflow-wrap: anywhere; }
.block ul { padding-left: 20px; display: grid; gap: 4px; }
.copy { font: 600 13px var(--sans); padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); }
.copy:hover { border-color: var(--muted); }
code.slug { font: 500 14px ui-monospace, "SFMono-Regular", Menlo, monospace; overflow-wrap: anywhere; background: var(--surface-2); padding: 8px 12px; border-radius: 10px; justify-self: start; }
.sub { font: 700 12px var(--sans); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin: 0; }

/* Comprobaciones */
.checkbox { display: grid; gap: 12px; padding: 18px; border-radius: 16px; background: var(--surface-2); }
.checkbox-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.checkbox-top strong { font: 700 17px var(--display); }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--ok); }
.bar.mid i { background: var(--warn); }
.block .checks, .checks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; line-height: 1.4; }
.checks .ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); margin-top: 1px; }
.checks li.off .ico { background: var(--bad-soft); color: var(--bad); }
.checks li.off span:last-child { color: var(--bad); font-weight: 600; }
.checks .ico svg { width: 13px; height: 13px; }

/* Artículo */
.article { border-radius: 16px; padding: 24px 26px; background: var(--surface-2); min-width: 0; }
.articulo { font: 17px/1.75 var(--serif); overflow-wrap: anywhere; color: var(--fg); max-width: 68ch; }

/* Utilidades */
function toast(msg) {

function errMsg(e) {
  if (e && (e.code === 'not_granted' || e.code === 'revoked')) return 'No tienes permiso para editar este panel.';
  if (e && e.code === 'invalid_argument') return 'No se pudo guardar: el elemento ya no existe o no es válido.';
  return 'Sin conexión con la base de datos. Inténtalo de nuevo.';
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  return isNaN(d) ? String(s) : d.toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function sortDesc(list) {

}
function safeLink(u) {
  const s = String(u ?? '');
  return /^https:\/\//.test(s) ? '<a href="' + esc(s) + '" target="_blank" rel="noopener noreferrer">' + esc(s) + '</a>' : esc(s || '—');
}
const TAGS_OK = new Set(['P', 'H2', 'H3', 'H4', 'UL', 'OL', 'LI', 'STRONG', 'EM', 'A', 'BLOCKQUOTE', 'BR', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TH', 'TD', 'IMG', 'FIGURE', 'FIGCAPTION']);
// Deja solo marcado de artículo seguro: sin scripts, sin atributos salvo enlaces https.
function sanitize(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  (function clean(parent) {
    for (const node of [...parent.childNodes]) {
      if (node.nodeType === 3) continue;
      if (node.nodeType !== 1) { node.remove(); continue; }
      clean(node);
      if (!TAGS_OK.has(node.tagName)) { node.replaceWith(...node.childNodes); continue; }
      const imgSrc = node.tagName === 'IMG' ? (node.getAttribute('src') || '') : '', imgAlt = node.tagName === 'IMG' ? (node.getAttribute('alt') || '') : '';
      for (const attr of [...node.attributes]) node.removeAttribute(attr.name);
      if (node.tagName === 'IMG') {
        let s = imgSrc; const m = /^uz-img:([A-Za-z0-9_-]+)$/.exec(s);
        if (m) { s = IMG_CACHE[m[1]] || ''; if (!s) cargarImagen(m[1]).then(u => { if (u && !state.editing) render(); }); }
        if (s && (/^https:\/\//.test(s) || DATA_IMG.test(s))) { node.setAttribute('src', s); node.setAttribute('alt', imgAlt); } else node.remove();
        continue;
      }
      if (node.tagName === 'A') {
        const href = node.getAttribute('href') || '';
        if (/^https:\/\//.test(href)) { node.setAttribute('href', href); node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); }
      }
    }
  })(tpl.content);
  return tpl.innerHTML;
}
function estado(e) {
  const [cls, label] = ESTADO[e] || ['quiet', String(e || '—').replace(/_/g, ' ')];

}
function copyBtn(text) {

}
function block(label, html, copyText) {

}
function copy(text) {

/* Comprobaciones de un borrador (las mismas de siempre) */
function checksData(x) {
  const html = String(x.cuerpo_html || '');
  const texto = html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  const pal = texto ? texto.split(' ').length : 0;
  const hrefs = [...html.matchAll(/href="([^"]+)"/g)].map(m => m[1]);
  const int = hrefs.filter(u => /^https:\/\/undraftedzone\.com\//.test(u)).length;
  const ext = hrefs.length - int;
  const ex = String(x.extracto || '').length;
  const ti = String(x.titulo || '').length;
  const todo = [x.titulo, x.extracto, texto, x.pie_instagram].join(' ').toLowerCase();
  return [
    [!!imgSegura(x.imagen_url), 'Portada WebP', 'Falta la portada'],
    [pal >= 600, pal + ' palabras en el cuerpo', 'Cuerpo de menos de 600 palabras'],
    [int >= 3 && int <= 5, int + ' enlaces internos', int + ' enlaces internos (se piden 3–5)'],
    [ext === 0, 'Sin enlaces externos', ext + ' enlaces externos en el cuerpo'],
    [ex >= 140 && ex <= 160, 'Extracto de ' + ex + ' caracteres', 'Extracto de ' + ex + ' caracteres (140–160)'],
    [ti >= 50 && ti <= 65, 'Titular de ' + ti + ' caracteres', 'Titular de ' + ti + ' caracteres (50–65)'],
    [!/apuest|cuota|odds|bookmaker|casino|parlay/.test(todo), 'Sin términos de apuestas', 'Término de apuestas detectado'],
  ];
}
function checklist(x) {
  const items = checksData(x);
  const ok = items.filter(i => i[0]).length;
  const pct = Math.round(ok / items.length * 100);
  const propio = x.origen === 'alejandro';
  return '<div class="checkbox' + (propio ? ' soft' : '') + '"><div class="checkbox-top"><strong>' + (ok === items.length ? 'Todo en orden' : (propio ? 'Sugerencias antes de publicar' : 'Revisa estos puntos')) + '</strong>'
    + '<span class="pill ' + (ok === items.length ? 'ok' : 'warn') + '">' + ok + ' de ' + items.length + ' comprobaciones</span></div>'
    + '<div class="bar' + (ok === items.length ? '' : ' mid') + '" role="img" aria-label="' + ok + ' de ' + items.length + ' comprobaciones superadas"><i style="width:' + pct + '%"></i></div>'
    + '<ul class="checks">' + items.map(([good, a, b]) => '<li class="' + (good ? 'ok' : 'off') + '"><span class="ico">' + (good ? ICON.ok : ICON.alerta) + '</span><span>' + esc(good ? a : b) + '</span></li>').join('') + '</ul></div>';
}
function pillsBorrador(x) {

/* Estado del ciclo: qué ha pasado y qué falta, de un vistazo */
function horasDesde(s) {
  const t = new Date(s);
  return isNaN(t) ? null : (Date.now() - t.getTime()) / 3600e3;
}
function hace(s) {
  const h = horasDesde(s);
  if (h === null) return '—';
  if (h < 1) return 'hace menos de 1 h';
  if (h < 48) return 'hace ' + Math.round(h) + ' h';
  return 'hace ' + Math.round(h / 24) + ' días';
}
function pulsoCiclo() {
  const ultimo = sortDesc(state.data.borradores || [])[0] || null;
  const h = ultimo ? horasDesde(ultimo.fecha) : null;
  const v = ultimo && ultimo.verificacion;
  const pendientes = v ? (v.pendientes_humano || []).length : 0;
  const verifOk = !!v && v.sin_comprobar === 0 && pendientes === 0;
  const alertas = (state.data.alertas || []).filter(x => x.estado === 'abierta').length;
  const enCola = (state.data.ideas || []).filter(x => x.estado === 'aprobada').length;
  const filas = [
    ['Último borrador', ultimo ? esc(ultimo.titulo || 'Sin titular') + ' · ' + hace(ultimo.fecha) : 'Ninguno todavía', h !== null && h <= 36],
    ['Verificación', v ? fmt(v.confirmadas + (v.corregidas || 0)) + ' confirmadas · ' + fmt(v.sin_comprobar) + ' sin comprobar' + (pendientes ? ' · ' + pendientes + ' para ti' : '') : 'Sin verificar', verifOk],
    ['Métricas web', metricsDoc() ? 'Actualizadas ' + hace(metricsDoc().actualizado) : 'Sin datos todavía', !!metricsDoc() && (horasDesde(metricsDoc().actualizado) || 99) <= 36],
    ['Ideas aprobadas en cola', enCola === 0 ? 'Ninguna' : fmt(enCola), enCola > 0],
    ['Alertas abiertas', alertas === 0 ? 'Ninguna' : plural(alertas, 'pendiente', 'pendientes'), alertas === 0],
  ];
  return '<section class="card panel"><div class="sec-head"><h2>Pulso del ciclo</h2></div><ul class="pulse">'
    + filas.map(([nombre, valor, ok]) => '<li class="' + (ok ? 'ok' : 'off') + '"><span class="ico">' + (ok ? ICON.ok : ICON.alerta) + '</span><span>' + esc(nombre) + '</span><em>' + valor + '</em></li>').join('')
    + '</ul></section>';
}

/* Métricas: lectura del documento web */
function metricsDoc() {
  return (state.data.metricas || []).find(x => x.id === 'web') || null;
}
function periodoDatos(p) {
  const d = metricsDoc();
  if (!d) return {};
  // Formato por periodos (pasada actual). Si el documento aún trae el formato plano, se muestran sus datos como periodo semana.
  if (d.periodos) return d.periodos[p] || {};
  return p === 'semana' ? { visitas: d.visitas, peticiones: d.peticiones, serie: d.serie, top: d.top, articulos: d.articulos, procedencia: d.procedencia || [] } : {};
}
function deltaHtml(actual, previo) {
  if (typeof actual !== 'number' || typeof previo !== 'number' || previo === 0) return '<span class="delta flat">sin comparar</span>';
  const pct = Math.round((actual - previo) / previo * 100);
  const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
  const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '•';
  return '<span class="delta ' + cls + '">' + arrow + ' ' + Math.abs(pct) + ' %</span>';
}
function cambioHtml(c) {
  if (typeof c !== 'number') return '<span class="delta flat">—</span>';
  const cls = c > 0 ? 'up' : c < 0 ? 'down' : 'flat';
  const arrow = c > 0 ? '▲' : c < 0 ? '▼' : '•';
  return '<span class="delta ' + cls + '">' + arrow + ' ' + Math.abs(c) + ' %</span>';
}
function spark(values) {
  const vals = (values || []).map(v => Number(v) || 0);
  if (!vals.length) return '';
  const max = Math.max(1, ...vals);
  return '<div class="spark" aria-hidden="true">' + vals.map(v => '<i style="height:' + Math.max(8, Math.round(v / max * 100)) + '%"></i>').join('') + '</div>';
}
const PERIODOS = [['dia', 'Día'], ['semana', 'Semana'], ['mes', 'Mes']];
const ORIGEN_CLASE = o => {
  const s = String(o || '').toLowerCase();
  if (s.includes('google')) return 'o-google';
  if (s.includes('instagram') || s.includes('x') || s.includes('facebook') || s.includes('twitter') || s.includes('reddit') || s.includes('whatsapp')) return 'o-social';
  if (s.includes('directo')) return 'o-directo';
  return 'o-otros';
};


/* Métricas: dashboard. Separa lectores reales de escáneres. */
const SCAN_RE = /\.env|\.s3cfg|\.git|\.aws|\.sql|\.bak|\.ya?ml|\.php\d?\b|admin\.php|wp-login|xmlrpc|phpmyadmin|cgi-bin|\/config|\/vendor\//i;
const esEscaner = ruta => SCAN_RE.test(String(ruta || ''));
function techo(m) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, m))));
  const n = m / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}
function graficoArea(serie) {
  const pts = (serie || []).map(s => ({ l: String(s.dia || ''), v: Number(s.visitas) || 0 }));
  if (!pts.length) return '';
  const W = 640, H = 240, L = 44, R = 12, T = 16, B = 30;
  const top = techo(Math.max(...pts.map(p => p.v)));
  const x = i => pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (H - T - B) * (1 - v / top);
  const grid = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const yy = y(top * f).toFixed(1);
    return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" class="cg"/>'
      + '<text x="' + (L - 8) + '" y="' + (+yy + 4) + '" class="ct" text-anchor="end">' + fmt(Math.round(top * f)) + '</text>';
  }).join('');
  const linea = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = linea + ' L' + x(pts.length - 1).toFixed(1) + ' ' + (H - B) + ' L' + x(0).toFixed(1) + ' ' + (H - B) + ' Z';
  const paso = Math.ceil(pts.length / 6);
  const etiquetas = pts.map((p, i) => (i % paso === 0 || i === pts.length - 1)
    ? '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" class="ct" text-anchor="' + (i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle') + '">' + esc(p.l.slice(-5)) + '</text>' : '').join('');
  const puntos = pts.map((p, i) => '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="' + (i === pts.length - 1 ? 5 : 3)
    + '" class="cdot' + (i === pts.length - 1 ? ' last' : '') + '"><title>' + esc(p.l) + ': ' + fmt(p.v) + ' visitas</title></circle>').join('');
  return '<svg class="achart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Visitas del periodo">'
    + grid + '<path d="' + area + '" class="carea"/><path d="' + linea + '" class="cline"/>' + puntos + etiquetas + '</svg>';
}
function lecturas(p) {
  const out = [];
  const serie = p.serie || [];
  if (typeof p.visitas === 'number' && typeof p.visitas_previas === 'number' && p.visitas_previas) {
    const pct = Math.round((p.visitas - p.visitas_previas) / p.visitas_previas * 100);
    out.push((pct >= 0 ? 'Sube ' : 'Baja ') + Math.abs(pct) + ' % frente al periodo anterior: ' + fmt(p.visitas) + ' visitas frente a ' + fmt(p.visitas_previas) + '.');
  }
  if (serie.length) {
    const mx = serie.reduce((a, b) => (b.visitas || 0) > (a.visitas || 0) ? b : a);
    out.push('Pico en ' + mx.dia + ' con ' + fmt(mx.visitas) + ' visitas.');
  }
  const top = p.top || [];
  const tot = top.reduce((a, r) => a + (r.visitas || 0), 0);
  const esc2 = top.filter(r => esEscaner(r.ruta)).reduce((a, r) => a + (r.visitas || 0), 0);
  if (tot && esc2) out.push(Math.round(esc2 / tot * 100) + ' % de las visitas del top son escáneres buscando archivos sensibles (.env, .s3cfg, admin.php). No son lectores.');
  if (!out.length) out.push('Todavía no hay datos suficientes en este periodo.');
  return out;
}
function paginasReales(top) {
  const reales = (top || []).filter(r => !esEscaner(r.ruta));
  const max = Math.max(1, ...reales.map(r => r.visitas || 0));
  return reales.slice(0, 10).map((r, i) => '<li class="pg"><span class="n">' + (i + 1) + '</span><div class="pg-main">'
    + '<div class="pg-row"><span class="pg-ruta">' + esc(r.ruta) + (r.tipo ? ' <span class="tipo">' + esc(r.tipo) + '</span>' : '') + '</span><b>' + fmt(r.visitas) + ' ' + cambioHtml(r.cambio) + '</b></div>'
    + '<div class="track"><i style="width:' + Math.round((r.visitas || 0) / max * 100) + '%"></i></div></div></li>').join('');
}
function escaneres(top) {
  const e = (top || []).filter(r => esEscaner(r.ruta));
  if (!e.length) return '';
  const suma = e.reduce((a, r) => a + (r.visitas || 0), 0);

    + '<div class="chips">' + e.slice(0, 6).map(r => '<span>' + esc(r.ruta) + ' · ' + fmt(r.visitas) + '</span>').join('') + '</div></section>';
}
function saludDatos(d, p) {

function barrasLista(items, etiqueta, valor) {

const DISPOSITIVO = { desktop: 'Escritorio', mobile: 'Móvil', tablet: 'Tableta' };

function slugify(t) {

/* Imágenes del cuerpo: viven en la colección imagenes y el cuerpo las cita como uz-img:<id> */
async function cargarImagen(id) {
  if (IMG_CACHE[id]) return IMG_CACHE[id];
  if (!state.db || IMG_PEDIDAS.has(id)) return '';
  IMG_PEDIDAS.add(id);
  try {
    const snap = await state.db.collection('imagenes').doc(id).get();
    const d = snap && snap.exists ? snap.data() : null;
    if (d && DATA_IMG.test(String(d.data || ''))) IMG_CACHE[id] = d.data;
  } catch (e) { /* sin imagen: se pinta un hueco */ }
  return IMG_CACHE[id] || '';
}
async function precargarImagenes(html) {
  const ids = [...new Set([...String(html || '').matchAll(/uz-img:([A-Za-z0-9_-]+)/g)].map(m => m[1]))];
  await Promise.all(ids.map(cargarImagen));
}
function toBlobAsync(canvas, tipo, q) { return new Promise(res => canvas.toBlob(res, tipo, q)); }
function leerDataUrl(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
}
// Reduce la imagen hasta que cabe en el límite. WebP si el navegador lo sabe codificar; si no, JPEG.
async function comprimirImagen(file, { maxBytes, maxAncho, recorte169 }) {
  let bmp;
  try { bmp = await createImageBitmap(file); } catch (e) {
    bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  }
  const sw = bmp.width || bmp.naturalWidth, sh = bmp.height || bmp.naturalHeight;
  let sx = 0, sy = 0, cw = sw, ch = sh;
  if (recorte169) {
    if (sw / sh > 16 / 9) { cw = Math.round(sh * 16 / 9); sx = Math.round((sw - cw) / 2); }
    else { ch = Math.round(sw * 9 / 16); sy = Math.round((sh - ch) / 2); }
  }
  let w = Math.min(cw, maxAncho), q = 0.82;
  const canvas = document.createElement('canvas');
  for (let i = 0; i < 14; i++) {
    const h = Math.round(ch * w / cw);
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bmp, sx, sy, cw, ch, 0, 0, w, h);
    let blob = await toBlobAsync(canvas, 'image/webp', q);
    if (!blob || blob.type !== 'image/webp') blob = await toBlobAsync(canvas, 'image/jpeg', q);
    if (blob && blob.size <= maxBytes) return { url: await leerDataUrl(blob), bytes: blob.size, w, h };
    if (q > 0.55) q -= 0.09; else { w = Math.round(w * 0.85); q = 0.78; }
    if (w < 480) break;
  }
  throw new Error('La imagen es demasiado pesada incluso reducida.');
}

/* Cuerpo guardado (bloques de WordPress) <-> contenido editable */
function aEditor(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  const out = document.createElement('div');
  const el = t => document.createElement(t);
  const inline = (nodo, dest) => {
    for (const n of nodo.childNodes) {
      if (n.nodeType === 3) { dest.appendChild(document.createTextNode(n.nodeValue)); continue; }
      if (n.nodeType !== 1) continue;
      const t = n.tagName;
      if (t === 'STRONG' || t === 'B') { const e = el('strong'); inline(n, e); dest.appendChild(e); }
      else if (t === 'EM' || t === 'I') { const e = el('em'); inline(n, e); dest.appendChild(e); }
      else if (t === 'A') { const e = el('a'); const h = n.getAttribute('href') || ''; if (/^https:\/\//.test(h)) e.setAttribute('href', h); inline(n, e); dest.appendChild(e); }
      else if (t === 'BR') dest.appendChild(el('br'));
      else if (t !== 'IMG' && t !== 'SCRIPT' && t !== 'STYLE') inline(n, dest);
    }
  };
  const figura = (img, cap) => {
    let src = img.getAttribute('src') || '', uz = '';
    const m = /^uz-img:([A-Za-z0-9_-]+)$/.exec(src);
    if (m) { uz = m[1]; src = IMG_CACHE[uz] || ''; }
    else if (!/^https:\/\//.test(src) && !DATA_IMG.test(src)) return null;
    const f = el('figure'); f.className = 'rte-fig'; f.contentEditable = 'false';
    if (uz) f.setAttribute('data-uz', uz);
    const i = el('img'); if (src) i.setAttribute('src', src); i.setAttribute('alt', img.getAttribute('alt') || '');
    const c = el('figcaption'); c.contentEditable = 'true'; c.textContent = cap || '';
    f.append(i, c);
    return f;
  };
  const simple = (t, n) => { const e = el(t); inline(n, e); if (e.textContent.trim() || e.querySelector('br')) out.appendChild(e); };
  const bloque = n => {
    if (n.nodeType === 3) { if (n.nodeValue.trim()) { const p = el('p'); p.textContent = n.nodeValue.trim(); out.appendChild(p); } return; }
    if (n.nodeType !== 1) return;
    const t = n.tagName;
    if (t === 'P') {
      const img = n.querySelector('img');
      if (img && !n.textContent.trim()) { const f = figura(img, ''); if (f) out.appendChild(f); } else simple('p', n);
    } else if (t === 'H1' || t === 'H2') simple('h2', n);
    else if (/^H[3-6]$/.test(t)) simple('h3', n);
    else if (t === 'UL' || t === 'OL') {
      const l = el(t.toLowerCase());
      for (const li of n.querySelectorAll(':scope > li')) { const e = el('li'); inline(li, e); l.appendChild(e); }
      if (l.children.length) out.appendChild(l);
    } else if (t === 'BLOCKQUOTE') {
      const q = el('blockquote'); const ps = n.querySelectorAll(':scope > p');
      if (ps.length) ps.forEach(p => { const e = el('p'); inline(p, e); q.appendChild(e); }); else { const e = el('p'); inline(n, e); q.appendChild(e); }
      out.appendChild(q);
    } else if (t === 'FIGURE' || t === 'IMG') {
      const img = t === 'IMG' ? n : n.querySelector('img');
      if (img) { const c = t === 'FIGURE' ? n.querySelector('figcaption') : null; const f = figura(img, c ? c.textContent.trim() : ''); if (f) out.appendChild(f); }
      else if (n.querySelector('table')) bloque(n.querySelector('table'));
    } else if (t === 'TABLE') {
      const tb = el('table');
      for (const tr of n.querySelectorAll('tr')) {
        const r = el('tr');
        for (const c of tr.children) { const e = el(c.tagName === 'TH' ? 'th' : 'td'); inline(c, e); r.appendChild(e); }
        tb.appendChild(r);
      }
      out.appendChild(tb);
    } else if (t !== 'SCRIPT' && t !== 'STYLE') for (const h of n.childNodes) bloque(h);
  };
  for (const n of tpl.content.childNodes) bloque(n);
  if (!out.childNodes.length) out.innerHTML = '<p><br></p>';
  return out.innerHTML;
}

const SER = {
  txt: s => esc(String(s).replace(/ /g, ' ')),
  inline(nodo) {
    let s = '';
    for (const n of nodo.childNodes) {
      if (n.nodeType === 3) { s += SER.txt(n.nodeValue); continue; }
      if (n.nodeType !== 1) continue;
      const t = n.tagName, d = SER.inline(n);
      if (t === 'STRONG' || t === 'B') s += d.trim() ? '<strong>' + d + '</strong>' : d;
      else if (t === 'EM' || t === 'I') s += d.trim() ? '<em>' + d + '</em>' : d;
      else if (t === 'A') { const h = n.getAttribute('href') || ''; s += /^https:\/\//.test(h) ? '<a href="' + esc(h) + '">' + d + '</a>' : d; }
      else if (t === 'BR') s += '<br>';
      else if (t === 'IMG' || t === 'FIGURE') s += '';
      else s += d;
    }
    return s;
  },
  parrafo: h => '<!-- wp:paragraph -->\n<p>' + h + '</p>\n<!-- /wp:paragraph -->',
  titulo: (n, h) => '<!-- wp:heading' + (n === 3 ? ' {"level":3}' : '') + ' -->\n<h' + n + ' class="wp-block-heading">' + h + '</h' + n + '>\n<!-- /wp:heading -->',
  lista(n) {
    const ord = n.tagName === 'OL', t = ord ? 'ol' : 'ul';
    const items = [...n.children].filter(c => c.tagName === 'LI').map(li => SER.inline(li)).filter(h => h.replace(/<br>/g, '').trim());
    if (!items.length) return '';
    return '<!-- wp:list' + (ord ? ' {"ordered":true}' : '') + ' -->\n<' + t + ' class="wp-block-list">'
      + items.map(h => '<!-- wp:list-item -->\n<li>' + h + '</li>\n<!-- /wp:list-item -->').join('\n\n') + '</' + t + '>\n<!-- /wp:list -->';
  },
  cita(n) {
    const ps = [...n.children].filter(c => c.tagName === 'P');
    const hs = (ps.length ? ps.map(p => SER.inline(p)) : [SER.inline(n)]).filter(h => h.replace(/<br>/g, '').trim());
    if (!hs.length) return '';
    return '<!-- wp:quote -->\n<blockquote class="wp-block-quote">' + hs.map(h => SER.parrafo(h)).join('\n') + '</blockquote>\n<!-- /wp:quote -->';
  },
  figura(f) {
    const img = f.querySelector('img'); if (!img) return '';
    const uz = f.getAttribute('data-uz');
    const src = uz ? 'uz-img:' + uz : (img.getAttribute('src') || '');
    if (!uz && !/^https:\/\//.test(src)) return '';
    const cap = f.querySelector('figcaption'); const c = cap ? cap.textContent.trim() : '';
    return '<!-- wp:image {"sizeSlug":"large","linkDestination":"none"} -->\n<figure class="wp-block-image size-large"><img src="' + esc(src) + '" alt="' + esc(img.getAttribute('alt') || '') + '"/>'
      + (c ? '<figcaption class="wp-element-caption">' + esc(c) + '</figcaption>' : '') + '</figure>\n<!-- /wp:image -->';
  },
  tabla(n) {
    const filas = [...n.querySelectorAll('tr')].map(tr => '<tr>' + [...tr.children].map(c => { const t = c.tagName === 'TH' ? 'th' : 'td'; return '<' + t + '>' + SER.inline(c) + '</' + t + '>'; }).join('') + '</tr>');
    return filas.length ? '<!-- wp:table -->\n<figure class="wp-block-table"><table><tbody>' + filas.join('') + '</tbody></table></figure>\n<!-- /wp:table -->' : '';
  },
};
function deEditor(raiz) {
  const bloques = [];
  const vacio = h => !h.replace(/<br>/g, '').trim();
  const proc = n => {
    if (n.nodeType === 3) { const h = SER.txt(n.nodeValue).trim(); if (h) bloques.push(SER.parrafo(h)); return; }
    if (n.nodeType !== 1) return;
    const t = n.tagName;

    if (n.nodeType === 1 && /^(H2|H3|BLOCKQUOTE|LI)$/.test(n.tagName)) return n.tagName === 'LI' ? (n.parentNode.tagName === 'OL' ? 'ol' : 'ul') : n.tagName.toLowerCase();

  const bl = bloqueActual();

  try { neg = document.queryCommandState('bold'); cur = document.queryCommandState('italic'); } catch (e) { /* sin estado */ }
  on('bold', neg); on('italic', cur); on('h2', bl === 'h2'); on('h3', bl === 'h3'); on('ul', bl === 'ul'); on('ol', bl === 'ol'); on('quote', bl === 'blockquote');

function cerrarTools() { const a = $('rte-link'), b = $('rte-img'); if (a) a.hidden = true; if (b) b.hidden = true; if (RTE.fig) { RTE.fig.classList.remove('is-sel'); RTE.fig = null; } }
function formato(cmd) {
  const area = $('ed-rte'); if (!area) return;
  if (cmd !== 'image' && cmd !== 'link') cerrarTools();
  restaurarSeleccion();
  const ex = (c, v) => { try { document.execCommand(c, false, v); } catch (e) { /* no soportado */ } };
  const actual = bloqueActual();
  switch (cmd) {
    case 'bold': ex('bold'); break;
    case 'italic': ex('italic'); break;
    case 'h2': ex('formatBlock', actual === 'h2' ? '<p>' : '<h2>'); break;
    case 'h3': ex('formatBlock', actual === 'h3' ? '<p>' : '<h3>'); break;
    case 'p': if (actual === 'ul' || actual === 'ol') ex(actual === 'ul' ? 'insertUnorderedList' : 'insertOrderedList'); ex('formatBlock', '<p>'); break;
    case 'quote': ex('formatBlock', actual === 'blockquote' ? '<p>' : '<blockquote>'); break;
    case 'ul': ex('insertUnorderedList'); break;
    case 'ol': ex('insertOrderedList'); break;
    case 'undo': ex('undo'); break;
    case 'redo': ex('redo'); break;
    case 'clear': ex('removeFormat'); ex('unlink'); break;

    if (RTE.sel && area.contains(RTE.sel.startContainer)) { bloque = RTE.sel.startContainer; while (bloque && bloque.parentNode !== area) bloque = bloque.parentNode; }
    if (bloque) bloque.after(fig); else area.appendChild(fig);
    if (!fig.nextElementSibling) { const p = document.createElement('p'); p.innerHTML = '<br>'; fig.after(p); }
    seleccionarFigura(fig);
    marcar('cuerpo'); toast('Imagen añadida. Escribe su descripción debajo.');
  } catch (e) { toast(e && e.message ? e.message : 'No se pudo subir la imagen.'); }
}
function seleccionarFigura(fig) {
  cerrarTools(); RTE.fig = fig; fig.classList.add('is-sel');
  $('rte-link').hidden = true; const t = $('rte-img'); t.hidden = false;
  $('rte-alt').value = fig.querySelector('img').getAttribute('alt') || '';
  fig.scrollIntoView({ block: 'nearest', behavior: reducido() ? 'auto' : 'smooth' });
}
async function elegirPortada(file) {
  if (!file) return;
  if (!/^image\//.test(file.type)) { toast('Ese archivo no es una imagen.'); return; }
  toast('Preparando la portada…');
  try {
    const r = await comprimirImagen(file, { maxBytes: 110 * 1024, maxAncho: 1200, recorte169: true });
    RTE.portada = r.url;
    const v = $('ed-portada-vista'); if (v) { v.classList.add('hay'); v.innerHTML = '<img alt="Portada del artículo">'; v.firstChild.src = r.url; }
    const n = $('ed-portada-nota'); if (n) n.textContent = 'Portada de ' + Math.round(r.bytes / 1024) + ' KB (' + r.w + '×' + r.h + ').';
    if (RTE.modo === 'escrito') marcar('imagen'); else RTE.tocado = true;
    toast('Portada lista');
  } catch (e) { toast(e && e.message ? e.message : 'No se pudo preparar la portada.'); }
}

/* Cableado del editor (delegado: sobrevive a los redibujados) */
function cablearEditor() {
  const s = $('screen');
  s.addEventListener('mousedown', e => { if (e.target.closest('.rte-bar button')) e.preventDefault(); });
  s.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'ed-rte') { marcar('cuerpo'); return; }
    if (id === 'ed-titulo') {
      if (!RTE.slugManual && RTE.modo === 'escrito') { const sl = $('ed-slug'); if (sl) { sl.value = slugify(e.target.value); marcar('slug'); } }
      marcar('titulo'); return;
    }
    if (id === 'ed-slug') { RTE.slugManual = true; marcar('slug'); return; }
    if (id === 'ed-extracto') { marcar('extracto'); return; }
    if (id === 'ed-etiquetas') { marcar('etiquetas'); return; }
    if (id === 'ed-pie') { marcar('pie'); return; }
    if (id === 'rte-alt' && RTE.fig) { RTE.fig.querySelector('img').setAttribute('alt', e.target.value); marcar('cuerpo'); }
  });
  s.addEventListener('change', e => {
    if (e.target.id === 'ed-img-file') { const f = e.target.files && e.target.files[0]; e.target.value = ''; insertarImagen(f); }
    if (e.target.id === 'ed-portada-file') { const f = e.target.files && e.target.files[0]; e.target.value = ''; elegirPortada(f); }
  });
  s.addEventListener('click', e => {
    const fig = e.target.closest && e.target.closest('figure.rte-fig');
    if (fig && e.target.tagName === 'IMG') seleccionarFigura(fig);
  });
  s.addEventListener('paste', e => {
    if (!e.target.closest || !e.target.closest('#ed-rte')) return;
    if (e.target.closest('figcaption')) { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData.getData('text/plain') || '').replace(/\s+/g, ' ')); return; }
    e.preventDefault();
    const html = e.clipboardData.getData('text/html'), txt = e.clipboardData.getData('text/plain');
    if (html) {
      const limpio = aEditor(html.replace(/<!--[\s\S]*?-->/g, '').replace(/<img[^>]*>/gi, ''));
      document.execCommand('insertHTML', false, limpio === '<p><br></p>' ? esc(txt) : limpio);
    } else document.execCommand('insertText', false, txt);
  });
  s.addEventListener('keydown', e => {
    if (e.target.id === 'rte-url' && e.key === 'Enter') { e.preventDefault(); ponerEnlace(); }
    if (e.target.id === 'ed-titulo' && e.key === 'Enter') { e.preventDefault(); const r = $('ed-rte'); if (r) r.focus(); }
    if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'ed-rte' && bloqueActual() === 'blockquote') {
      // Enter en una línea vacía de una cita: salir de la cita
      const sel = getSelection(); let n = sel.anchorNode; while (n && n.parentNode && n.parentNode.tagName !== 'BLOCKQUOTE' && n.tagName !== 'BLOCKQUOTE') n = n.parentNode;
      const linea = n && n.nodeType === 1 && n.tagName !== 'BLOCKQUOTE' ? n : null;
      if ((linea && !linea.textContent.trim()) || (n && n.tagName === 'BLOCKQUOTE' && !n.textContent.trim())) {
        e.preventDefault();
        try { document.execCommand('formatBlock', false, '<p>'); } catch (err) { /* nada */ }
        normalizarArea(); marcar('cuerpo');
      }
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && e.target.closest && e.target.closest('#ed-rte')) { e.preventDefault(); guardarSeleccion(); formato('link'); }
  });
  document.addEventListener('selectionchange', () => { if ($('ed-rte') && document.activeElement === $('ed-rte')) { guardarSeleccion(); actualizarBarra(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) vaciarGuardado(); });
  window.addEventListener('pagehide', () => { vaciarGuardado(); });
}

/* Vista Escribir */
function cardEscrito(x) {
  const pal = textoPlano(x.cuerpo_html).split(' ').filter(Boolean).length;
  return '<button class="item" data-act="abrir_escrito" data-id="' + esc(x.id) + '"><span class="item-top">' + estado(x.estado) + '<span class="item-date">' + esc(fmtDate(x.actualizado_en || x.fecha)) + '</span></span>'
    + '<span class="item-title">' + esc(x.titulo || 'Sin titular') + '</span>'
    + '<span class="item-sub">' + esc(pal ? pal + ' palabras' : 'Sin texto todavía') + '</span></button>';
}
function renderEscribir() {
  const todos = state.data.borradores || [];
  const ed = state.editing ? todos.find(x => x.id === state.editing) : null;
  if (ed) return '<article class="card">' + editor(ed) + '</article>';
  const mios = sortDesc(todos.filter(esEscrito));
  return '<section class="card hero-write"><span class="eyebrow">Tu mesa de redacción</span><h2>Escribe un artículo desde aquí</h2>'
    + '<p>Titular, portada, texto con negritas, títulos, listas e imágenes. Se guarda solo y puedes seguir desde el móvil o el ordenador. Cuando termines, lo dejas listo y se publica desde Borradores.</p>'
    + '<div class="actions"><button class="btn primary big" data-act="nuevo_escrito">Nuevo artículo</button></div></section>'
    + '<section class="sec"><div class="sec-head"><h2>En escritura</h2><span class="count">' + mios.length + '</span></div>'
    + (mios.length ? '<div class="list">' + mios.map(cardEscrito).join('') + '</div>' : emptyBox('Nada en marcha', 'Pulsa «Nuevo artículo» para empezar el primero.', 'idea')) + '</section>';
}

/* Navegación y eventos */
function go(view, id) {
  if (state.editing && RTE.modo === 'escrito') vaciarGuardado();
  state.view = view;
  state.sel = id || null;
  state.editing = null;
  state.confirm = null;
  location.hash = view;
  render(true);
  window.scrollTo({ top: 0, behavior: reducido() ? 'auto' : 'smooth' });
}

function wire() {
  document.getElementById('nav').addEventListener('click', e => {
    const b = e.target.closest('[data-act="nav"]');
    if (b) go(b.dataset.view, null);
  });

  document.getElementById('screen').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === 'open') { go(b.dataset.screen, b.dataset.id); return; }
    if (act === 'nav') { go(b.dataset.view, null); return; }
    if (act === 'jump') {
      const t = document.getElementById(b.dataset.target);
      if (t) t.scrollIntoView({ behavior: reducido() ? 'auto' : 'smooth', block: 'start' });
      return;
    }
    if (act === 'periodo') { state.periodo = b.dataset.p; render(); return; }
    if (act === 'filtro') { state.filtro = b.dataset.f; render(); return; }
    if (act === 'select') {
      state.sel = b.dataset.id; state.confirm = null; render();
      // Al abrir un borrador, el foco va a su titular: lectores de pantalla y teclado anuncian el detalle.
      const t = document.getElementById('detalle-titulo');
      if (t) t.focus({ preventScroll: false });
      return;
    }
    if (act === 'close') { state.sel = null; state.confirm = null; render(); return; }
    if (act === 'copy') { copy(b.dataset.copy); return; }
    if (act === 'edit') {
      const bb = (state.data.borradores || []).find(x => x.id === b.dataset.id);
      state.editing = b.dataset.id; state.confirm = null;
      if (esEscrito(bb)) { state.view = 'escribir'; location.hash = 'escribir'; }
      render(true); return;
    }
    if (act === 'cancel_edit') { state.editing = null; render(true); return; }
    if (act === 'nuevo_escrito') { crearArticulo(); return; }
    if (act === 'abrir_escrito') { state.editing = b.dataset.id; state.confirm = null; render(true); return; }
    if (act === 'cerrar_escrito') { cerrarEscrito(); return; }
    if (act === 'pedir_verificacion') { finalizarEscrito(b.dataset.id, 'pendiente_revision'); return; }
    if (act === 'dejar_listo') { finalizarEscrito(b.dataset.id, 'aprobado'); return; }
    if (act === 'rte') { formato(b.dataset.cmd); return; }
    if (act === 'link_ok') { ponerEnlace(); return; }
    if (act === 'link_quitar') { quitarEnlace(); return; }
    if (act === 'tools_cerrar') { cerrarTools(); return; }
    if (act === 'img_quitar') { if (RTE.fig) { RTE.fig.remove(); RTE.fig = null; cerrarTools(); marcar('cuerpo'); } return; }
    if (act === 'portada_pick') { const f = document.getElementById('ed-portada-file'); if (f) f.click(); return; }
    if (act === 'save_edit') { saveEdit(b.dataset.id); return; }
    if (act === 'ask_delete') { state.confirm = { key: b.dataset.key, id: b.dataset.id }; render(); return; }
    if (act === 'cancel_delete') { state.confirm = null; render(); return; }
    if (act === 'do_delete') { removeItem(b.dataset.key, b.dataset.id); return; }
    if (act === 'ask_borrar_devueltos') { state.confirm = { key: 'borrar_devueltos', id: '*' }; render(); return; }
    if (act === 'do_borrar_devueltos') { borrarDevueltos(); return; }
    if (act === 'upload') { requestUpload(b); return; }
    if (act === 'ask_approve' || act === 'ask_return' || act === 'ask_upload') { state.confirm = { key: act.slice(4), id: b.dataset.id }; render(); return; }
    const a = ACTIONS[act];
    if (!a) return;
    if (act === 'approve') {
      const borr = (state.data.borradores || []).find(x => x.id === b.dataset.id);
      if (borr && !/^data:image\/(?:webp|jpeg);base64,|^https:\/\//.test(String(borr.imagen_url || ''))) {
        toast('Falta la portada: no se puede aprobar sin imagen');
        return;
      }
    }
    if (act === 'approve') {
      const borr = (state.data.borradores || []).find(x => x.id === b.dataset.id);
      if (borr && !checksData(borr)[6][0]) { toast('Hay un término de apuestas en el texto: no se puede aprobar.'); return; }
    }
    write(a.col, b.dataset.id, a.patch, a.msg);
  });

  window.addEventListener('hashchange', () => {
    const k = location.hash.slice(1);
    if (VIEWS.some(v => v.key === k) && k !== state.view) go(k, null);
  });
}

(async function init() {
  const h = location.hash.slice(1);
  if (VIEWS.some(v => v.key === h)) state.view = h;
  wire();
  cablearEditor();
  render();
  try {
    const api = window.claude;
    state.db = api ? await api.use('db') : null;
  } catch (e) {
    state.db = null;
  }
  state.ready = true;
  if (state.db) subscribe();
  else document.getElementById('sync').textContent = 'Sin acceso a datos';
  render();
})();
</script>
