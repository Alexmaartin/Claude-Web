<title>Panel Editorial UndraftedZone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
:root {
  --bg: #f4f4f0;
  --surface: #ffffff;
  --surface-2: #ececE6;
  --line: #dcdcd3;
  --fg: #1b1d19;
  --muted: #666a60;
  --accent: #b1441a;
  --on-accent: #ffffff;
  --ok: #2c6638;
  --warn: #8a5a00;
  --bad: #9e2a20;
  --info: #245e7e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 6px 18px rgba(0, 0, 0, .05);
  color-scheme: light;
  --serif: "Source Serif 4", Georgia, serif;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121310;
    --surface: #1b1d18;
    --surface-2: #242720;
    --line: #353930;
    --fg: #ebe8e0;
    --muted: #9da192;
    --accent: #f08a55;
    --on-accent: #1a0e04;
    --ok: #86c592;
    --warn: #e2b660;
    --bad: #ef8074;
    --info: #8ac3dd;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121310;
  --surface: #1b1d18;
  --surface-2: #242720;
  --line: #353930;
  --fg: #ebe8e0;
  --muted: #9da192;
  --accent: #f08a55;
  --on-accent: #1a0e04;
  --ok: #86c592;
  --warn: #e2b660;
  --bad: #ef8074;
  --info: #8ac3dd;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--sans);
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
a { color: var(--accent); }

/* Cabecera */
.hero { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.kicker { margin: 0 0 2px; font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font: 600 28px/1.1 var(--serif); }
.live { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono); color: var(--muted); padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live.on::before { background: var(--ok); }

/* Resumen */
.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
@media (min-width: 760px) { .summary { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.stat { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; box-shadow: var(--shadow); min-width: 0; }
.stat:hover { border-color: var(--muted); }
.stat .n { display: block; font: 600 26px/1 var(--serif); }
.stat .l { display: block; margin-top: 6px; font: 500 12px var(--sans); color: var(--muted); }
.stat.hot { border-color: var(--accent); }
.stat.hot .n { color: var(--accent); }

/* Propuesta de hoy */
.today { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; box-shadow: var(--shadow); display: grid; gap: 8px; min-width: 0; }
.today .eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.today h2 { margin: 0; font: 600 20px/1.25 var(--serif); text-wrap: balance; overflow-wrap: anywhere; }
.today p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
.today.empty { color: var(--muted); }
.today.empty .eyebrow { color: var(--muted); }

/* Pestañas */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.tab .badge { font: 500 12px var(--mono); min-width: 22px; text-align: center; padding: 1px 6px; border-radius: 999px; background: var(--surface-2); color: var(--fg); }
.tab[aria-selected="true"] .badge { background: var(--accent); color: var(--on-accent); }

/* Lista y detalle */
.view { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 960px) {
  .view { grid-template-columns: minmax(300px, .9fr) minmax(0, 1.4fr); align-items: start; }
  .list { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; }
}
.view[data-mode="detail"] .list { display: none; }
.view[data-mode="list"] .detail { display: none; }
@media (min-width: 960px) {
  .view[data-mode="detail"] .list, .view[data-mode="list"] .detail { display: block; }
}

.list { display: grid; gap: 10px; align-content: start; min-width: 0; }
.card { display: grid; gap: 8px; text-align: left; width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; cursor: pointer; box-shadow: var(--shadow); }
.card:hover { border-color: var(--muted); }
.card.is-sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card-date { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
.card-title { margin: 0; font: 600 16px/1.3 var(--serif); overflow-wrap: anywhere; }
.card-sub { margin: 0; color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

/* Estados */
.estado { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--sans); padding: 5px 9px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
.estado::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.e-warn { color: var(--warn); }
.e-ok { color: var(--ok); }
.e-bad { color: var(--bad); }
.e-info { color: var(--info); }
.e-quiet { color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { padding: 2px 8px; border-radius: 6px; background: var(--surface-2); font: 12px var(--mono); }

/* Detalle */
.detail { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; overflow: hidden; }
.detail-inner { padding: 18px; display: grid; gap: 16px; min-width: 0; }
.dhead { display: grid; gap: 10px; }
.back { justify-self: start; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--muted); font: 500 13px var(--sans); }
.dtitle { margin: 0; font: 600 24px/1.2 var(--serif); text-wrap: balance; overflow-wrap: anywhere; }
.dmeta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; color: var(--muted); font: 13px var(--sans); }

.block { display: grid; gap: 6px; min-width: 0; }
.block-label { font: 500 11px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.block p, .block ul { margin: 0; overflow-wrap: anywhere; }
.block ul { padding-left: 18px; }
.copy { font: 500 12px var(--sans); padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; }
.copy:hover { border-color: var(--muted); }
code.slug { font: 14px var(--mono); overflow-wrap: anywhere; background: var(--surface-2); padding: 4px 8px; border-radius: 6px; justify-self: start; }

.article-box { border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; background: var(--bg); min-width: 0; }
.articulo { font: 16px/1.65 var(--serif); overflow-wrap: anywhere; }
.articulo h3, .articulo h4 { font-family: var(--sans); line-height: 1.3; margin: 1.4em 0 .4em; }
.articulo h3 { font-size: 18px; }
.articulo h4 { font-size: 15px; }
.articulo p { margin: 0 0 1em; }
.articulo ul { padding-left: 20px; margin: 0 0 1em; }
.articulo a { color: var(--accent); }

details.raw summary { cursor: pointer; color: var(--muted); font: 500 13px var(--sans); }
pre.preview { max-height: 260px; overflow: auto; margin: 8px 0 0; padding: 10px; border-radius: 6px; background: var(--surface-2); font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }

/* Acciones */
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 4px; }
.btn { font: 500 14px var(--sans); padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: wait; }
.btn.small { padding: 4px 10px; font-size: 12px; }
.spacer { flex: 1; }

.confirm { display: grid; gap: 10px; padding: 14px; border-radius: 10px; border: 1px solid var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }
.confirm p { margin: 0; }

/* Edición */
.ed { width: 100%; box-sizing: border-box; font: 14px/1.5 var(--sans); padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
.ed.mono { font: 13px/1.45 var(--mono); }
.field { display: grid; gap: 6px; min-width: 0; }

/* Vacío */
.empty-state { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 36px 18px; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; background: var(--surface); margin: 0; }
.empty-state strong { color: var(--fg); font: 600 18px/1.3 var(--serif); }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; box-shadow: var(--shadow); display: grid; gap: 4px; min-width: 0; }
.kpi-n { font: 600 26px/1 var(--serif); }
.kpi-l { font: 500 12px var(--sans); color: var(--muted); }
.metrics { display: grid; gap: 12px; min-width: 0; }
.panel-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.panel-card h3 { margin: 0 0 12px; font: 600 16px/1.3 var(--serif); }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; }
.bar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; min-width: 0; }
.bar span { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.bar em { font: 11px var(--mono); font-style: normal; color: var(--muted); }
.rank { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.rank li { display: flex; justify-content: space-between; gap: 12px; }
.rank li span, .rank li a { overflow-wrap: anywhere; min-width: 0; }
.rank li b { font: 600 14px var(--mono); white-space: nowrap; }
.quiet { color: var(--muted); }
.small { font-size: 12px; }
@media (max-width: 560px) { .kpis { grid-template-columns: 1fr; } }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 10px; background: var(--fg); color: var(--bg); font: 14px var(--sans); box-shadow: var(--shadow); }
</style>

<header class="hero">
  <div>
    <p class="kicker">UndraftedZone</p>
    <h1>Panel editorial</h1>
  </div>
  <span class="live" id="sync">Conectando</span>
</header>

<section class="summary" id="summary" aria-label="Resumen"></section>
<section class="today" id="today" aria-live="polite"></section>
<nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
<main class="view" id="view" data-mode="list"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nowIso = () => new Date().toISOString();

const TABS = [
  { key: 'borradores', label: 'Borradores', col: 'borradores', open: x => x.estado === 'pendiente_revision' },
  { key: 'ideas', label: 'Ideas evergreen', col: 'ideas_evergreen', open: x => x.estado === 'propuesta' },
  { key: 'metricas', label: 'Métricas', col: 'metricas', open: () => false },
  { key: 'seo', label: 'SEO', col: 'incidencias_seo', open: x => x.estado === 'abierta' },
];
const COL = Object.fromEntries(TABS.map(t => [t.key, t.col]));

const EMPTY = {
  borradores: ['Sin propuestas pendientes', 'Cuando se genere el artículo de hoy, aparecerá aquí.'],
  ideas: ['Sin idea pendiente', 'Cuando haya hueco, aparecerá aquí una idea evergreen para aprobar o denegar.'],
  fichas: ['Sin cambios de ficha', 'Aquí aparecerán las propuestas para jugadores y equipos.'],
  seo: ['Sin incidencias SEO abiertas', 'El auditor SEO avisará cuando haya algo que revisar.'],
  alertas: ['Sin alertas', 'Solo aparecen las que requieren tu criterio.'],
};

const ESTADO = {
  pendiente_revision: ['warn', 'Pendiente'], aprobado: ['ok', 'Aprobado'], publicado_borrador: ['ok', 'En WordPress'],
  devuelto: ['bad', 'Devuelto'], nueva: ['info', 'Nueva'], para_redactar: ['ok', 'Para redactar'],
  redactada: ['ok', 'Redactada'], descartada: ['quiet', 'Descartada'], sin_confirmar: ['bad', 'Sin confirmar'],
  propuesto: ['info', 'Propuesto'], aceptado: ['ok', 'Aceptado'], rechazado: ['quiet', 'Rechazado'],
  abierta: ['warn', 'Abierta'], resuelta: ['ok', 'Resuelta'], ignorada: ['quiet', 'Ignorada'],
};

const ACTIONS = {
  approve: { col: 'borradores', patch: { estado: 'aprobado' }, msg: 'Borrador aprobado' },
  return: { col: 'borradores', patch: { estado: 'devuelto' }, msg: 'Devuelto para cambios' },
  approve_idea: { col: 'ideas_evergreen', patch: { estado: 'aprobada' }, msg: 'Idea aprobada: se redactará en el próximo día evergreen' },
  deny_idea: { col: 'ideas_evergreen', patch: { estado: 'denegada' }, msg: 'Idea denegada' },
  redact: { col: 'noticias', patch: { estado: 'para_redactar' }, msg: 'Marcada para redactar' },
  discard: { col: 'noticias', patch: { estado: 'descartada' }, msg: 'Noticia descartada' },
  accept_change: { col: 'cambios_ficha', run: acceptChange },
  reject_change: { col: 'cambios_ficha', patch: { estado: 'rechazado' }, msg: 'Cambio rechazado' },
  resolve_seo: { col: 'incidencias_seo', patch: { estado: 'resuelta' }, msg: 'Incidencia resuelta' },
  ignore_seo: { col: 'incidencias_seo', patch: { estado: 'ignorada' }, msg: 'Incidencia ignorada' },
  resolve_alert: { col: 'alertas', patch: { estado: 'resuelta' }, msg: 'Alerta cerrada' },
};

const state = { ready: false, db: null, tab: 'borradores', sel: null, editing: null, confirm: null, data: {}, busy: new Set() };
TABS.forEach(t => { state.data[t.key] = null; });
state.data.noticias = null;

/* Utilidades */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.hidden = true; }, 2600);
}
function errMsg(e) {
  if (e && (e.code === 'not_granted' || e.code === 'revoked')) return 'No tienes permiso para editar este panel.';
  if (e && e.code === 'invalid_argument') return 'No se pudo guardar: el elemento ya no existe o no es válido.';
  return 'Sin conexión con la base de datos. Inténtalo de nuevo.';
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  return isNaN(d) ? String(s) : d.toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function safeLink(u) {
  const s = String(u ?? '');
  return /^https:\/\//.test(s) ? '<a href="' + esc(s) + '" target="_blank" rel="noopener noreferrer">' + esc(s) + '</a>' : esc(s || '—');
}
const TAGS_OK = new Set(['P', 'H2', 'H3', 'H4', 'UL', 'OL', 'LI', 'STRONG', 'EM', 'A', 'BLOCKQUOTE', 'BR']);
// Deja solo marcado de artículo seguro: sin scripts, sin atributos salvo enlaces https.
function sanitize(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  (function clean(parent) {
    for (const node of [...parent.childNodes]) {
      if (node.nodeType === 3) continue;
      if (node.nodeType !== 1) { node.remove(); continue; }
      clean(node);
      if (!TAGS_OK.has(node.tagName)) { node.replaceWith(...node.childNodes); continue; }
      for (const attr of [...node.attributes]) node.removeAttribute(attr.name);
      if (node.tagName === 'A') {
        const href = node.getAttribute('href') || '';
        if (/^https:\/\//.test(href)) { node.setAttribute('href', href); node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); }
      }
    }
  })(tpl.content);
  return tpl.innerHTML;
}
function estado(e) {
  const [cls, label] = ESTADO[e] || ['quiet', String(e || '—').replace(/_/g, ' ')];
  return '<span class="estado e-' + cls + '">' + esc(label) + '</span>';
}
function copyBtn(text) {
  return text ? '<button class="copy" data-act="copy" data-copy="' + esc(text) + '">Copiar</button>' : '';
}
function block(label, html, copyText) {
  return '<div class="block"><div class="block-label"><span>' + esc(label) + '</span>' + copyBtn(copyText) + '</div>' + html + '</div>';
}
function copy(text) {
  try {
    navigator.clipboard.writeText(text).then(() => toast('Copiado'), () => toast('No se pudo copiar. Selecciona el texto.'));
  } catch (e) {
    toast('No se pudo copiar. Selecciona el texto.');
  }
}

/* Textos de tarjeta */
function titleFor(key, x) {
  if (key === 'fichas') return (x.entidad || '—') + ' · ' + (x.campo || '—');
  if (key === 'seo') return x.problema || 'Incidencia SEO';
  if (key === 'alertas') return x.mensaje || 'Alerta';
  return x.titulo || 'Sin titular';
}
function subFor(key, x) {
  if (key === 'borradores') return x.extracto || '';
  if (key === 'noticias') return [x.fuente, x.tipo_fuente].filter(Boolean).join(' · ');
  if (key === 'fichas') return (x.valor_anterior || '—') + ' → ' + (x.valor_nuevo || '—');
  if (key === 'seo') return x.pagina || '';
  return x.contexto || x.tipo || '';
}

function card(key, x) {
  const sel = x.id === state.sel ? ' is-sel' : '';
  const tags = key === 'borradores' && (x.etiquetas || []).length
    ? '<div class="chips">' + x.etiquetas.slice(0, 4).map(t => '<span>' + esc(t) + '</span>').join('') + '</div>' : '';
  return '<button class="card' + sel + '" data-act="select" data-id="' + esc(x.id) + '">'
    + '<div class="card-top">' + estado(x.estado) + '<span class="card-date">' + esc(fmtDate(x.fecha)) + '</span></div>'
    + '<h2 class="card-title">' + esc(titleFor(key, x)) + '</h2>'
    + '<p class="card-sub">' + esc(subFor(key, x)) + '</p>' + tags + '</button>';
}

/* Borrado con confirmación en la propia página */
function deleteBlock(key, id) {
  const c = state.confirm && state.confirm.key === key && state.confirm.id === id;
  if (c) {
    const extra = key === 'borradores' ? ' La noticia de origen pasa a descartada, para que no se vuelva a redactar.' : '';
    return '<div class="confirm"><p><strong>¿Eliminar este elemento?</strong> No se puede deshacer.' + esc(extra) + '</p>'
      + '<div class="actions"><button class="btn danger" data-act="do_delete" data-key="' + key + '" data-id="' + esc(id) + '">Sí, eliminar</button>'
      + '<button class="btn" data-act="cancel_delete">Cancelar</button></div></div>';
  }
  return '<div class="actions"><span class="spacer"></span><button class="btn ghost danger" data-act="ask_delete" data-key="' + key + '" data-id="' + esc(id) + '">Eliminar</button></div>';
}

function btn(act, id, label, primary) {
  const busy = state.busy.has(ACTIONS[act].col + '/' + id);
  return '<button class="btn' + (primary ? ' primary' : '') + '" data-act="' + act + '" data-id="' + esc(id) + '"' + (busy ? ' disabled' : '') + '>' + esc(label) + '</button>';
}

/* Vistas de detalle */
function detailHead(title, meta) {
  return '<div class="dhead"><button class="back" data-act="close">← Volver a la lista</button>'
    + '<h2 class="dtitle">' + esc(title) + '</h2><div class="dmeta">' + meta + '</div></div>';
}

function editor(x) {
  const v = s => esc(s || '');
  return '<div class="detail-inner">'
    + '<div class="dhead"><button class="back" data-act="cancel_edit">← Cancelar edición</button><h2 class="dtitle">Editando borrador</h2></div>'
    + '<div class="field"><div class="block-label"><span>Titular</span></div><input class="ed" id="ed-titulo" value="' + v(x.titulo) + '"></div>'
    + '<div class="field"><div class="block-label"><span>Slug</span></div><input class="ed mono" id="ed-slug" value="' + v(x.slug) + '"></div>'
    + '<div class="field"><div class="block-label"><span>Extracto</span></div><textarea class="ed" id="ed-extracto" rows="3">' + v(x.extracto) + '</textarea></div>'
    + '<div class="field"><div class="block-label"><span>Etiquetas (separadas por comas)</span></div><input class="ed" id="ed-etiquetas" value="' + v((x.etiquetas || []).join(', ')) + '"></div>'
    + '<div class="field"><div class="block-label"><span>Pie de Instagram</span></div><textarea class="ed" id="ed-pie" rows="4">' + v(x.pie_instagram) + '</textarea></div>'
    + '<div class="field"><div class="block-label"><span>Artículo (HTML)</span></div><textarea class="ed mono" id="ed-cuerpo" rows="18">' + v(x.cuerpo_html) + '</textarea></div>'
    + '<div class="actions"><button class="btn primary" data-act="save_edit" data-id="' + v(x.id) + '">Guardar cambios</button>'
    + '<button class="btn" data-act="cancel_edit">Cancelar</button></div></div>';
}

function detailBorrador(x) {
  if (state.editing === x.id) return editor(x);
  const tags = (x.etiquetas || []).map(t => '<span>' + esc(t) + '</span>').join('');
  const fuentes = (x.fuentes || []).map(f => '<li>' + safeLink(f) + '</li>').join('');
  const canApprove = x.estado === 'pendiente_revision' || x.estado === 'devuelto';
  const canReturn = x.estado === 'pendiente_revision';
  const actions = '<div class="actions">'
    + (canApprove ? btn('approve', x.id, 'Aprobar', true) : '')
    + (canReturn ? btn('return', x.id, 'Devolver', false) : '')
    + (x.estado === 'aprobado' ? uploadBtn(x) : '')
    + '<button class="btn" data-act="edit" data-id="' + esc(x.id) + '">Editar</button></div>';
  return '<div class="detail-inner">'
    + detailHead(x.titulo || 'Sin titular', estado(x.estado) + '<span>' + esc(fmtDate(x.fecha)) + '</span><span>Confianza ' + esc(x.confianza || '—') + '</span>')
    + (x.imagen_url ? block('Portada', '<img src="' + esc(x.imagen_url) + '" alt="" style="max-width:100%;border-radius:8px">') : '')
    + '<div class="article-box"><div class="articulo">' + sanitize(x.cuerpo_html) + '</div></div>'
    + block('Slug', '<code class="slug">' + esc(x.slug || '—') + '</code>', x.slug)
    + block('Extracto', '<p>' + esc(x.extracto || '—') + '</p>', x.extracto)
    + block('Etiquetas', '<div class="chips">' + (tags || '<span>—</span>') + '</div>', (x.etiquetas || []).join(', '))
    + block('Pie de Instagram', '<p style="white-space:pre-wrap">' + esc(x.pie_instagram || '—') + '</p>', x.pie_instagram)
    + block('Fuentes', fuentes ? '<ul>' + fuentes + '</ul>' : '<p>—</p>')
    + '<details class="raw"><summary>Ver HTML para copiar</summary><pre class="preview">' + esc(x.cuerpo_html || '') + '</pre></details>'
    + actions + deleteBlock('borradores', x.id) + '</div>';
}

function detailNoticia(x) {
  const actions = x.estado === 'nueva'
    ? '<div class="actions">' + btn('redact', x.id, 'Marcar para redactar', true) + btn('discard', x.id, 'Descartar', false) + '</div>' : '';
  return '<div class="detail-inner">'
    + detailHead(x.titulo || 'Sin titular', estado(x.estado) + '<span>' + esc(x.fuente || '—') + '</span><span>' + esc(x.tipo_fuente || '—') + '</span><span>Confianza ' + esc(x.confianza || '—') + '</span>')
    + block('Resumen', '<p>' + esc(x.resumen || '—') + '</p>')
    + block('Fuente', '<p>' + safeLink(x.url) + '</p>')
    + block('Detectada', '<p>' + esc(fmtDate(x.detectada_en)) + '</p>')
    + actions + deleteBlock('noticias', x.id) + '</div>';
}

function detailFicha(x) {
  const actions = x.estado === 'propuesto'
    ? '<div class="actions">' + btn('accept_change', x.id, 'Aceptar cambio', true) + btn('reject_change', x.id, 'Rechazar', false) + '</div>' : '';
  return '<div class="detail-inner">'
    + detailHead(x.entidad || '—', estado(x.estado) + '<span>' + esc(x.campo || '—') + '</span>')
    + block('Cambio', '<p>' + esc(x.valor_anterior || '—') + ' → <strong>' + esc(x.valor_nuevo || '—') + '</strong></p>')
    + block('Motivo', '<p>' + esc(x.motivo || '—') + '</p>')
    + block('Fuente', '<p>' + safeLink(x.fuente) + '</p>')
    + actions + deleteBlock('fichas', x.id) + '</div>';
}

function detailSeo(x) {
  const actions = x.estado === 'abierta'
    ? '<div class="actions">' + btn('resolve_seo', x.id, 'Resuelta', true) + btn('ignore_seo', x.id, 'Ignorar', false) + '</div>' : '';
  return '<div class="detail-inner">'
    + detailHead(x.problema || 'Incidencia SEO', estado(x.estado) + '<span>Prioridad ' + esc(x.prioridad || '—') + '</span>')
    + block('Página', '<p>' + safeLink(x.pagina) + '</p>')
    + block('Impacto', '<p>' + esc(x.impacto || '—') + '</p>')
    + block('Sugerencia', '<p>' + esc(x.sugerencia || '—') + '</p>')
    + actions + deleteBlock('seo', x.id) + '</div>';
}

function detailAlerta(x) {
  const actions = x.estado === 'abierta' ? '<div class="actions">' + btn('resolve_alert', x.id, 'Cerrar alerta', true) + '</div>' : '';
  return '<div class="detail-inner">'
    + detailHead(x.mensaje || 'Alerta', estado(x.estado) + '<span>' + esc(x.tipo || '—') + '</span><span>' + esc(fmtDate(x.fecha)) + '</span>')
    + block('Contexto', '<p>' + esc(x.contexto || '—') + '</p>')
    + actions + deleteBlock('alertas', x.id) + '</div>';
}

function detailIdea(x) {
  return '<div class="detail-inner">'
    + detailHead(x.titulo || 'Idea evergreen', estado(x.estado) + '<span>Evergreen</span>')
    + block('Ángulo', '<p>' + esc(x.angulo || '—') + '</p>')
    + block('Tema de origen', '<p>' + esc(x.tema || '—') + '</p>')
    + (x.estado === 'propuesta' ? '<div class="actions">' + btn('approve_idea', x.id, 'Aprobar', true) + btn('deny_idea', x.id, 'Denegar', false) + '</div>' : '')
    + '</div>';
}

function detail(key, x) {
  if (key === 'ideas') return detailIdea(x);
  if (key === 'borradores') return detailBorrador(x);
  if (key === 'noticias') return detailNoticia(x);
  if (key === 'fichas') return detailFicha(x);
  if (key === 'seo') return detailSeo(x);
  return detailAlerta(x);
}

/* Resumen, propuesta de hoy y pestañas */
function renderSummary() {
  const count = key => {
    const t = TABS.find(x => x.key === key);
    const items = state.data[key];
    return items ? items.filter(t.open).length : 0;
  };
  const cells = [
    ['borradores', 'Propuestas pendientes'],
    ['ideas', 'Idea evergreen pendiente'],
    ['seo', 'Incidencias SEO'],
  ];
  document.getElementById('summary').innerHTML = cells.map(([key, label]) => {
    const n = state.data[key] ? count(key) : '…';
    const hot = typeof n === 'number' && n > 0 ? ' hot' : '';
    return '<button class="stat' + hot + '" data-act="go" data-key="' + key + '"><span class="n">' + n + '</span><span class="l">' + esc(label) + '</span></button>';
  }).join('');
}

function renderToday() {
  const box = document.getElementById('today');
  if (!state.data.borradores) { box.className = 'today empty'; box.innerHTML = '<span class="eyebrow">Hoy</span><p>Cargando…</p>'; return; }
  const pend = state.data.borradores.filter(x => x.estado === 'pendiente_revision')
    .sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
  if (!pend.length) {
    box.className = 'today empty';
    box.innerHTML = '<span class="eyebrow">Hoy</span><p>No hay propuesta pendiente. La siguiente aparecerá aquí cuando se genere.</p>';
    return;
  }
  const x = pend[0];
  box.className = 'today';
  box.innerHTML = '<span class="eyebrow">Propuesta de hoy</span>'
    + '<h2>' + esc(x.titulo || 'Sin titular') + '</h2>'
    + '<p>' + esc(x.extracto || '') + '</p>'
    + '<div class="actions"><button class="btn primary" data-act="open_today" data-id="' + esc(x.id) + '">Revisar propuesta</button></div>';
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(t => {
    const items = state.data[t.key];
    const n = items ? items.filter(t.open).length : '';
    const sel = t.key === state.tab ? 'true' : 'false';
    return '<button class="tab" role="tab" data-tab="' + t.key + '" aria-selected="' + sel + '">' + esc(t.label)
      + (n !== '' ? '<span class="badge">' + n + '</span>' : '') + '</button>';
  }).join('');
}

/* Vista principal */
function render() {
  renderSummary();
  renderToday();
  renderTabs();
  const view = document.getElementById('view');
  if (state.tab === 'metricas') { renderMetrics(); return; }
  if (!state.ready) { view.innerHTML = '<div class="empty-state"><strong>Conectando</strong><span>Un momento…</span></div>'; return; }
  if (!state.db) { view.innerHTML = '<div class="empty-state"><strong>Sin acceso a los datos</strong><span>Pide acceso al propietario de este artifact.</span></div>'; return; }

  const t = TABS.find(x => x.key === state.tab);
  const items = state.data[t.key];
  if (items === null) { view.innerHTML = '<div class="empty-state"><strong>Cargando</strong></div>'; return; }
  if (!items.length) {
    const [title, text] = EMPTY[t.key];
    view.dataset.mode = 'list';
    view.innerHTML = '<div class="empty-state"><strong>' + esc(title) + '</strong><span>' + esc(text) + '</span></div>';
    return;
  }

  const sorted = [...items].sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
  if (state.sel && !sorted.some(x => x.id === state.sel)) state.sel = null;
  const sel = sorted.find(x => x.id === state.sel);
  view.dataset.mode = sel ? 'detail' : 'list';
  view.innerHTML = '<div class="list">' + sorted.map(x => card(t.key, x)).join('') + '</div>'
    + '<div class="detail">' + (sel ? detail(t.key, sel) : '<div class="detail-inner"><p class="empty-state"><span>Elige un elemento de la lista para verlo aquí.</span></p></div>') + '</div>';
}

/* Métricas: los datos los escribe la pasada diaria en la colección metricas, documento web */
function kpi(label, value) {
  return '<div class="kpi"><span class="kpi-n">' + esc(value ?? '—') + '</span><span class="kpi-l">' + esc(label) + '</span></div>';
}

function renderMetrics() {
  const view = document.getElementById('view');
  view.dataset.mode = 'list';
  const d = (state.data.metricas || []).find(x => x.id === 'web');
  if (!d) {
    view.innerHTML = '<div class="empty-state"><strong>Sin métricas todavía</strong><span>Se rellenan en la pasada diaria con datos de Cloudflare y WordPress.</span></div>';
    return;
  }
  const serie = d.serie || [];
  const max = Math.max(1, ...serie.map(p => p.visitas || 0));
  const bars = serie.map(p => '<div class="bar" title="' + esc(p.dia) + ': ' + esc(p.visitas) + '"><span style="height:' + Math.round((p.visitas || 0) / max * 100) + '%"></span><em>' + esc(String(p.dia || '').slice(5)) + '</em></div>').join('');
  const top = (d.top || []).map(p => '<li><span>' + esc(p.ruta) + '</span><b>' + esc(p.visitas) + '</b></li>').join('');
  const arts = (d.articulos || []).map(a => '<li><a href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">' + esc(a.titulo) + '</a><b>' + esc(a.vistas) + '</b></li>').join('');
  view.innerHTML = '<div class="metrics">'
    + '<div class="kpis">' + kpi('Visitas (7 días)', d.visitas) + kpi('Peticiones (7 días)', d.peticiones) + kpi('Artículos publicados', d.articulos_publicados) + '</div>'
    + '<section class="panel-card"><h3>Visitas por día</h3><div class="bars">' + bars + '</div></section>'
    + '<section class="panel-card"><h3>Artículos con más impacto</h3><ol class="rank">' + (arts || '<li><span>Sin datos todavía</span></li>') + '</ol></section>'
    + '<section class="panel-card"><h3>Páginas más vistas</h3><ol class="rank">' + (top || '<li><span>Sin datos todavía</span></li>') + '</ol></section>'
    + '<p class="quiet small">Actualizado: ' + esc(fmtDate(d.actualizado)) + '</p></div>';
}

/* Escrituras */
async function write(col, id, patch, msg) {
  const key = col + '/' + id;
  if (state.busy.has(key)) return;
  state.busy.add(key);
  render();
  try {
    await state.db.collection(col).doc(id).update({ ...patch, actualizado_en: nowIso() });
    if (msg) toast(msg);
  } catch (e) {
    toast(errMsg(e));
  } finally {
    state.busy.delete(key);
  }
}

async function acceptChange(id) {
  const c = state.data.fichas && state.data.fichas.find(x => x.id === id);
  if (!c) return;
  const key = 'cambios_ficha/' + id;
  if (state.busy.has(key)) return;
  state.busy.add(key);
  render();
  try {
    const now = nowIso();
    const ficha = state.db.collection('fichas').doc(c.ficha_id);
    const snap = await ficha.get();
    const patch = { [c.campo]: c.valor_nuevo, verificado_en: now, fuente_ultima: c.fuente || '' };
    if (snap.exists) await ficha.update(patch);
    else await ficha.set({ nombre: c.entidad || '', ...patch });
    await state.db.collection('cambios_ficha').doc(id).update({ estado: 'aceptado', actualizado_en: now });
    toast('Cambio aceptado');
  } catch (e) {
    toast(errMsg(e));
  } finally {
    state.busy.delete(key);
  }
}

async function removeItem(key, id) {
  const col = COL[key];
  const k = col + '/' + id;
  if (state.busy.has(k)) return;
  state.busy.add(k);
  render();
  try {
    if (key === 'borradores') {
      const b = (state.data.borradores || []).find(x => x.id === id);
      await state.db.collection('borradores').doc(id).delete();
      if (b && b.noticia_id) {
        try { await state.db.collection('noticias').doc(b.noticia_id).update({ estado: 'descartada', actualizado_en: nowIso() }); } catch (e) { /* la noticia puede no existir */ }
      }
    } else {
      await state.db.collection(col).doc(id).delete();
    }
    state.confirm = null;
    state.sel = null;
    toast('Eliminado');
  } catch (e) {
    toast(errMsg(e));
  } finally {
    state.busy.delete(k);
    render();
  }
}

async function saveEdit(id) {
  const g = s => document.getElementById(s).value;
  const patch = {
    titulo: g('ed-titulo').trim(),
    slug: g('ed-slug').trim(),
    extracto: g('ed-extracto').trim(),
    etiquetas: g('ed-etiquetas').split(',').map(t => t.trim()).filter(Boolean),
    pie_instagram: g('ed-pie').trim(),
    cuerpo_html: g('ed-cuerpo'),
    editado_por_humano: true,
  };
  if (!patch.titulo) { toast('El titular no puede estar vacío.'); return; }
  if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(patch.slug)) { toast('El slug solo admite minúsculas, números y guiones.'); return; }
  const key = 'borradores/' + id;
  if (state.busy.has(key)) return;
  state.busy.add(key);
  try {
    // Registro de ediciones humanas: el aprendizaje semanal lee esta colección.
    const previo = (state.data.borradores || []).find(x => x.id === id) || {};
    await state.db.collection('ediciones').add({
      borrador_id: id,
      fecha: nowIso(),
      antes: { titulo: previo.titulo, slug: previo.slug, extracto: previo.extracto, etiquetas: previo.etiquetas, pie_instagram: previo.pie_instagram, cuerpo_html: previo.cuerpo_html },
      despues: patch,
    });
    await state.db.collection('borradores').doc(id).update({ ...patch, actualizado_en: nowIso() });
    state.editing = null;
    toast('Cambios guardados');
  } catch (e) {
    toast(errMsg(e));
  } finally {
    state.busy.delete(key);
    render();
  }
}

/* Subida a WordPress: el comentario del visor despierta la sesión que sube */
function uploadBtn(x) {
  const label = x.subida_solicitada ? 'Publicación solicitada' : 'Publicar en WordPress';
  return '<button class="btn primary" data-act="upload" data-id="' + esc(x.id) + '">' + label + '</button>';
}

async function requestUpload(b) {
  const id = b.dataset.id;
  // El gesto del visor abre el comentario sobre el botón; enviarlo lanza la subida.
  try {
    const comments = window.claude ? await window.claude.use('comments') : null;
    if (comments) await comments.openComposer({ element: b });
  } catch (e) { /* comentarios no disponibles en esta vista */ }
  try {
    await state.db.collection('borradores').doc(id).update({ subida_solicitada: true, subida_solicitada_en: nowIso(), modo: 'publicar', actualizado_en: nowIso() });
    toast('Publicación solicitada. Envía el comentario para lanzarla.');
  } catch (e) {
    toast(errMsg(e));
  }
  render();
}

/* Datos en directo */
function subscribe() {
  TABS.forEach(t => {
    state.db.collection(t.col).onSnapshot(
      snap => {
        state.data[t.key] = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
        // Mientras se edita un borrador no se redibuja, para no borrar lo escrito.
        if (state.editing && t.key === 'borradores') { renderSummary(); renderToday(); renderTabs(); } else render();
      },
      e => {
        if (!state.data[t.key]) state.data[t.key] = [];
        toast(errMsg(e));
        render();
      }
    );
  });
  // Las noticias también hacen falta para descartarlas al borrar su borrador.
  state.db.collection('noticias').onSnapshot(
    snap => { state.data.noticias = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() })); render(); },
    () => {}
  );
  const s = document.getElementById('sync');
  s.textContent = 'En directo';
  s.classList.add('on');
}

/* Eventos */
function go(key, id) {
  state.tab = key;
  state.sel = id || null;
  state.editing = null;
  state.confirm = null;
  location.hash = key;
  render();
}

function wire() {
  document.getElementById('tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]');
    if (b) go(b.dataset.tab, null);
  });

  document.getElementById('summary').addEventListener('click', e => {
    const b = e.target.closest('[data-act="go"]');
    if (b) go(b.dataset.key, null);
  });

  document.getElementById('today').addEventListener('click', e => {
    const b = e.target.closest('[data-act="open_today"]');
    if (b) go('borradores', b.dataset.id);
  });

  document.getElementById('view').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === 'select') { state.sel = b.dataset.id; state.confirm = null; render(); return; }
    if (act === 'close') { state.sel = null; state.confirm = null; render(); return; }
    if (act === 'copy') { copy(b.dataset.copy); return; }
    if (act === 'edit') { state.editing = b.dataset.id; state.confirm = null; render(); return; }
    if (act === 'cancel_edit') { state.editing = null; render(); return; }
    if (act === 'save_edit') { saveEdit(b.dataset.id); return; }
    if (act === 'ask_delete') { state.confirm = { key: b.dataset.key, id: b.dataset.id }; render(); return; }
    if (act === 'cancel_delete') { state.confirm = null; render(); return; }
    if (act === 'do_delete') { removeItem(b.dataset.key, b.dataset.id); return; }
    if (act === 'upload') { requestUpload(b); return; }
    const a = ACTIONS[act];
    if (!a) return;
    if (a.run) a.run(b.dataset.id);
    else write(a.col, b.dataset.id, a.patch, a.msg);
  });

  window.addEventListener('hashchange', () => {
    const k = location.hash.slice(1);
    if (TABS.some(t => t.key === k) && k !== state.tab) go(k, null);
  });
}

(async function init() {
  const h = location.hash.slice(1);
  if (TABS.some(t => t.key === h)) state.tab = h;
  wire();
  render();
  try {
    const api = window.claude;
    state.db = api ? await api.use('db') : null;
  } catch (e) {
    state.db = null;
  }
  state.ready = true;
  if (state.db) subscribe();
  else document.getElementById('sync').textContent = 'Sin acceso a datos';
  render();
})();
</script>
